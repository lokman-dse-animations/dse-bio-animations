<style>
  :root {
    --bg: #f7f9fc;
    --panel: #ffffff;
    --ink: #1a2332;
    --muted: #5a6a7a;
    --accent: #2c5aa0;
    --accent-soft: #e8f0fa;
    --border: #d0dae6;
    --starch: #7b5ea7;
    --starch-light: #a88fd4;
    --enzyme: #e67e22;
    --enzyme-dark: #c45f0e;
    --sugar: #27ae60;
    --sugar-light: #52d68a;
    --iodine: #c0392b;
    --iodine-pale: #e8c84a;
    --ok: #2e7d4f;
    --warn: #c0392b;
    --tube: #5b9bd5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC",
                 "Heiti TC", "Source Han Sans TC", sans-serif;
  }
  body { display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 1.35rem;

    letter-spacing: 0.02em;
  }
  header .sub { font-size: 0.9rem; color: var(--muted); }
  .main {

  @media (max-width: 960px) {

  }
  .stage-wrap {
    background: var(--panel);

    overflow: hidden;
    display: flex;

  }
  .canvas-box {
    position: relative;
    width: 100%;
    background: linear-gradient(180deg, #eef4fb 0%, #f8fafc 45%, #eef4fb 100%);
    aspect-ratio: 16 / 10;
    min-height: 380px;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .legend-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 14px 20px;
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    background: #fafcfe;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .swatch {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.12); flex-shrink: 0;
  }
  .swatch.rect { border-radius: 3px; width: 18px; height: 12px; }
  .side { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(26,35,50,0.06);
  }
  .card h2 { font-size: 0.95rem; color: var(--accent); margin-bottom: 8px; }
  .scene-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; line-height: 1.35; }
  .scene-desc { font-size: 0.92rem; line-height: 1.55; color: var(--ink); }
  .scene-desc strong { color: var(--accent); }
  .def-box {
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--accent-soft);
    border-left: 4px solid var(--accent);
    border-radius: 0 8px 8px 0;
    font-size: 0.88rem;
    line-height: 1.5;
  }
  .steps { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; }
  .step-btn {
    text-align: left; border: 1px solid var(--border); background: #fff;
    border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 0.88rem;
    cursor: pointer; color: var(--ink);
    transition: background 0.15s, border-color 0.15s;
  }
  .step-btn:hover { background: var(--accent-soft); }
  .step-btn.active {
    background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600;
  }
  .step-btn .num {
    display: inline-block; width: 1.4em; opacity: 0.7; font-variant-numeric: tabular-nums;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    border: none; border-radius: 8px; padding: 8px 14px; font: inherit;
    font-size: 0.88rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.secondary { background: #eef2f7; color: var(--ink); }
  .btn.secondary:hover { background: #e0e8f0; }
  .hint { font-size: 0.78rem; color: var(--muted); line-height: 1.45; margin-top: 10px; }
  footer {
    text-align: center; padding: 8px 16px 14px;
    font-size: 0.75rem; color: var(--muted);
  }
  kbd {
    display: inline-block; padding: 1px 6px; border: 1px solid var(--border);
    border-radius: 4px; background: #fff;
    font-family: ui-monospace, monospace; font-size: 0.85em;
  }
  a.back-link {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.92rem;
    white-space: nowrap;
    margin-right: 4px;
  }
  a.back-link:hover { text-decoration: underline; }
</style>

<body>
<header>
  <a class="back-link" href="f3-biology.html">← 返回課次目錄</a>
  <h1>化學消化（澱粉）</h1>
  <span class="sub">雅集單元12《健康的身體》· 約圖12.20＋實驗12.8 · 香港中學生物／科學</span>
</header>

<div class="main">
  <div class="stage-wrap">
    <div class="canvas-box">
      <canvas id="cv" width="1280" height="800" aria-label="化學消化澱粉動畫"></canvas>
    </div>
    <div class="legend-bar">
      <span class="legend-item"><span class="swatch" style="background:#7b5ea7"></span>澱粉（大分子）</span>
      <span class="legend-item"><span class="swatch" style="background:#e67e22"></span>澱粉酶（amylase）</span>
      <span class="legend-item"><span class="swatch" style="background:#27ae60"></span>麥芽糖／較簡單糖類</span>
      <span class="legend-item"><span class="swatch" style="background:#1a1a2e"></span>碘液＋澱粉＝藍黑</span>

    </div>

  <aside class="side">
    <div class="card">
      <div class="scene-title" id="sceneTitle">場景 1：澱粉＋澱粉酶</div>
      <p class="scene-desc" id="sceneDesc"></p>
      <div class="def-box" id="defBox">
        <strong>化學消化</strong>＝用酶把大分子食物分解成<strong>較簡單物質</strong>（<strong>產生新物質</strong>）。
      </div>

        <button class="btn" id="btnPlay" type="button">暫停</button>
        <button class="btn secondary" id="btnPrev" type="button">上一步</button>
        <button class="btn secondary" id="btnNext" type="button">下一步</button>
        <button class="btn secondary" id="btnRestart" type="button">重設</button>
      </div>

        鍵盤：<kbd>←</kbd><kbd>→</kbd> 切換場景 · <kbd>空白鍵</kbd> 暫停／播放 · <kbd>R</kbd> 重設<br>
        適合投影：全螢幕開啟本頁（F11），按場景逐步講解。
      </p>

</div>

<footer>
  原創教學動畫 · 概念對應雅集單元12《健康的身體》圖12.20 化學消化＋實驗12.8 碘液測澱粉 · 教師：Lok Man · 離線單檔
</footer>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("cv");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  const scenes = [
    {
      id: "meet",
      title: "場景 1：澱粉＋澱粉酶",
      desc: "大分子<strong>澱粉</strong>（一串相連的葡萄糖單位示意）與<strong>澱粉酶（amylase）</strong>接近。口腔唾液澱粉酶／胰澱粉酶可把澱粉分解為<strong>較簡單糖類</strong>。"
    },
    {
      id: "break",
      title: "場景 2：酶把鏈切斷",
      desc: "同一粒<strong>澱粉酶</strong>：先切整條鏈<strong>中間</strong>→兩邊各四單位；再切每邊<strong>中間鍵</strong>→拆成<strong>兩個兩個</strong>（麥芽糖）。學生版可記：<strong>澱粉 → 糖</strong>（旁註：主要先成<strong>麥芽糖</strong>）。"
    },
    {
      id: "new",
      title: "場景 3：產生新物質",
      desc: "對比<strong>機械消化</strong>：化學消化<strong>改變化學結構</strong>、<strong>產生新物質</strong>。澱粉（大分子）≠ 麥芽糖（較簡單物質）。"
    },
    {
      id: "iodine",
      title: "場景 4：碘液實驗對照",
      desc: "實驗12.8概念：<strong>無酶／仍有澱粉＋碘液＝藍黑</strong>；<strong>有澱粉酶、澱粉已分解＋碘液＝唔變藍黑</strong>（碘液原色：黃／啡）。"
    }
  ];

  let sceneIndex = 0;
  let playing = true;
  let t0 = performance.now();
  let sceneT = 0;

  const stepsEl = document.getElementById("steps");
  const titleEl = document.getElementById("sceneTitle");
  const descEl = document.getElementById("sceneDesc");
  const btnPlay = document.getElementById("btnPlay");

  scenes.forEach(function (s, i) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "step-btn" + (i === 0 ? " active" : "");
    b.innerHTML = '<span class="num">' + (i + 1) + ".</span> " + s.title.replace(/^場景 \d+：/, "");
    b.addEventListener("click", function () { goScene(i); });
    stepsEl.appendChild(b);
  });

  function updateUI() {
    titleEl.textContent = scenes[sceneIndex].title;
    descEl.innerHTML = scenes[sceneIndex].desc;
    [...stepsEl.children].forEach(function (el, i) {
      el.classList.toggle("active", i === sceneIndex);
    });
    btnPlay.textContent = playing ? "暫停" : "播放";
  }

  function goScene(i) {
    sceneIndex = (i + scenes.length) % scenes.length;
    sceneT = 0;
    t0 = performance.now();
    updateUI();
  }

  function restartScene() {
    sceneT = 0;
    t0 = performance.now();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function smoothstep(a, b, x) {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }

  function drawHex(x, y, r, fill, stroke) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 6 + i * Math.PI / 3;
      const px = x + Math.cos(a) * r;
      const py = y + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = stroke || "rgba(0,0,0,0.25)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function drawStarchChain(cx, cy, n, gap, scale, brokenAt, opts) {
    // brokenAt: bond index that is cut (null = intact)
    // opts.gapFrac: 0–1 how far the right half has moved away
    // opts.highlightBond: bond index to emphasize (before cut)
    // opts.omitBond: bond index to draw with a visible gap (partial snap)
    opts = opts || {};
    const gapFrac = opts.gapFrac || 0;
    const highlightBond = opts.highlightBond;
    const omitBond = opts.omitBond;
    const units = [];
    const totalW = (n - 1) * gap;
    const x0 = cx - totalW / 2;
    const sep = (brokenAt != null ? 55 : 0) * scale * gapFrac;
    for (let i = 0; i < n; i++) {
      let x = x0 + i * gap;
      let y = cy;
      if (brokenAt != null && i > brokenAt) {
        x += sep;
        y += 8 * Math.sin(i + gapFrac * 2) * gapFrac;
      }
      units.push({ x: x, y: y });
    }
    // bonds
    ctx.lineCap = "round";
    for (let i = 0; i < n - 1; i++) {
      if (omitBond != null && i === omitBond) continue;
      if (brokenAt != null && i === brokenAt && gapFrac > 0.15) continue;
      const isHi = highlightBond != null && i === highlightBond;
      ctx.strokeStyle = isHi ? "#c0392b" : "#5a3d8a";
      ctx.lineWidth = (isHi ? 9 : 5) * scale;
      if (isHi) {
        ctx.shadowColor = "rgba(192,57,43,0.55)";
        ctx.shadowBlur = 12;
      }
      ctx.beginPath();
      ctx.moveTo(units[i].x, units[i].y);
      ctx.lineTo(units[i + 1].x, units[i + 1].y);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    // hex units
    for (let i = 0; i < n; i++) {
      drawHex(units[i].x, units[i].y, 22 * scale, "#7b5ea7", "#5a3d8a");
    }
    return units;
  }

  function drawCutMark(x, y, progress) {
    // Zig-zag snap mark that grows with progress (0–1)
    const p = Math.max(0, Math.min(1, progress));
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.65 * p;
    ctx.strokeStyle = "#c0392b";
    ctx.lineWidth = 3 + 2 * p;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const h = 55 * p;
    ctx.beginPath();
    ctx.moveTo(x - 6, y - h);
    ctx.lineTo(x + 10, y - h * 0.45);
    ctx.lineTo(x - 8, y + h * 0.1);
    ctx.lineTo(x + 12, y + h);
    ctx.stroke();
    // Small spark dots near the cut
    if (p > 0.4) {
      ctx.fillStyle = "#e74c3c";
      for (let i = 0; i < 4; i++) {
        const a = i * 1.7 + progress * 4;
        const rr = 18 + i * 6;
        ctx.beginPath();
        ctx.arc(x + Math.cos(a) * rr, y + Math.sin(a) * rr * 0.6, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawEnzyme(x, y, label) {
    ctx.save();
    ctx.translate(x, y);
    // Pac-man / lock shape suggesting active site
    ctx.beginPath();
    ctx.arc(0, 0, 36, 0.35, Math.PI * 2 - 0.35);
    ctx.lineTo(8, 0);
    ctx.closePath();
    const g = ctx.createRadialGradient(-8, -8, 4, 0, 0, 36);
    g.addColorStop(0, "#ffb366");
    g.addColorStop(0.6, "#e67e22");
    g.addColorStop(1, "#c45f0e");
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = "rgba(100,50,0,0.4)";
    ctx.lineWidth = 2;
    ctx.stroke();
    // Active site notch highlight
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath();
    ctx.arc(10, 0, 10, 0, Math.PI * 2);
    ctx.fill();
    if (label) {
      ctx.fillStyle = "#c45f0e";
      ctx.font = "bold 22px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(label, 0, 58);
      ctx.font = "16px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
      ctx.fillStyle = "#5a6a7a";
      ctx.fillText("amylase", 0, 78);
    }
    ctx.restore();
  }

  function drawMaltose(x, y, scale) {
    const s = scale || 1;
    drawHex(x - 18 * s, y, 18 * s, "#27ae60", "#1e8449");
    drawHex(x + 18 * s, y, 18 * s, "#52d68a", "#1e8449");
    ctx.strokeStyle = "#1e8449";
    ctx.lineWidth = 4 * s;
    ctx.beginPath();
    ctx.moveTo(x - 6 * s, y);
    ctx.lineTo(x + 6 * s, y);
    ctx.stroke();
  }

  function drawCallout(x, y, text, color, fontSize) {
    const fs = fontSize || 26;
    ctx.font = "bold " + fs + "px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
    const tw = ctx.measureText(text).width;
    const pad = 12;
    roundRect(x - tw / 2 - pad, y - fs * 0.55, tw + pad * 2, fs * 1.2, 8);
    ctx.fillStyle = "rgba(255,255,255,0.94)";
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, x, y);
    ctx.textBaseline = "alphabetic";
  }

  function drawFootnote(x, y, text) {
    ctx.fillStyle = "#5a6a7a";
    ctx.font = "20px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(text, x, y);
  }

  function drawTestTube(x, y, fillColor, label, sublabel) {
    const tw = 70;
    const th = 200;
    // Tube body
    ctx.save();
    roundRect(x - tw / 2, y, tw, th, 12);
    ctx.fillStyle = "rgba(200,220,240,0.35)";
    ctx.fill();
    ctx.strokeStyle = "#5b9bd5";
    ctx.lineWidth = 3;
    ctx.stroke();
    // Liquid
    roundRect(x - tw / 2 + 6, y + 40, tw - 12, th - 52, 8);
    ctx.fillStyle = fillColor;
    ctx.fill();
    // Rim
    ctx.beginPath();
    ctx.moveTo(x - tw / 2 - 4, y);
    ctx.lineTo(x + tw / 2 + 4, y);
    ctx.strokeStyle = "#2c5aa0";
    ctx.lineWidth = 4;
    ctx.stroke();
    // Labels
    ctx.fillStyle = "#1a2332";
    ctx.font = "bold 22px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(label, x, y + th + 32);
    if (sublabel) {
      ctx.font = "18px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
      ctx.fillStyle = "#5a6a7a";
      ctx.fillText(sublabel, x, y + th + 58);
    }
    ctx.restore();
  }

  function drawScene1(t) {
    // Title labels
    ctx.fillStyle = "#7b5ea7";
    ctx.font = "bold 32px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("澱粉（大分子）", 80, 80);

    drawStarchChain(W * 0.42, H * 0.42, 8, 55, 1.1, null);

    // Enzyme approaches from right
    const approach = smoothstep(0, 2.5, t);
    const ex = W * 0.88 - approach * W * 0.22;
    const ey = H * 0.42 + Math.sin(t * 2) * 8;
    drawEnzyme(ex, ey, "澱粉酶");

    drawCallout(W * 0.5, H * 0.78, "澱粉酶靠近澱粉鏈", "#e67e22", 28);
    drawFootnote(W * 0.5, H * 0.88, "唾液澱粉酶／胰澱粉酶（amylase）");
  }

  function drawScene2(t) {
    // Same amylase, three cuts (classroom-slow):
    // 0–2.0s   dock on 8-chain middle bond
    // 2.0–4.5s cut → two tetramers separate
    // 4.5–6.0s move to LEFT tetramer middle
    // 6.0–8.5s cut left → two maltose pairs
    // 8.5–10.0s move to RIGHT tetramer middle
    // 10.0–12.5s cut right → two maltose pairs
    // 12.5s+   hold four maltose (idle bob)
    const GAP = 50;
    const SCALE = 1.0;
    const R = 22 * SCALE;
    const cy = H * 0.40;
    const baseCx = W * 0.42;

    const T1_APPROACH = 2.0;
    const T1_CUT0 = 2.0, T1_CUT1 = 4.5;
    const T2_MOVE0 = 4.5, T2_MOVE1 = 6.0;
    const T2_CUT0 = 6.0, T2_CUT1 = 8.5;
    const T3_MOVE0 = 8.5, T3_MOVE1 = 10.0;
    const T3_CUT0 = 10.0, T3_CUT1 = 12.5;
    const HOLD = 12.5;

    ctx.fillStyle = "#7b5ea7";
    ctx.font = "bold 28px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("澱粉 → 較簡單糖類", 80, 70);

    // Separation of the two tetramers after first cut
    const sep1 = smoothstep(T1_CUT0 + 0.4, T1_CUT1, t) * 95;
    const leftCx = baseCx - 1.5 * GAP - sep1 * 0.55;
    const rightCx = baseCx + 1.5 * GAP + sep1 * 0.55;
    const leftCy = cy + smoothstep(T1_CUT0 + 0.5, T1_CUT1, t) * 18;
    const rightCy = cy - smoothstep(T1_CUT0 + 0.5, T1_CUT1, t) * 10;

    // Progress helpers for each cut (0–1)
    const cut1 = smoothstep(T1_CUT0, T1_CUT1, t);
    const cut2 = smoothstep(T2_CUT0, T2_CUT1, t);
    const cut3 = smoothstep(T3_CUT0, T3_CUT1, t);

    // Left/right tetramer further split into pairs (extra gap after secondary cuts)
    const leftPairSep = smoothstep(0.4, 1, cut2) * 38;
    const rightPairSep = smoothstep(0.4, 1, cut3) * 38;

    // Maltose fade-in (after each secondary cut is well underway)
    const leftMaltA = smoothstep(T2_CUT0 + 1.4, T2_CUT0 + 2.2, t);
    const leftMaltB = smoothstep(T2_CUT0 + 1.9, T2_CUT0 + 2.7, t);
    const rightMaltA = smoothstep(T3_CUT0 + 1.4, T3_CUT0 + 2.2, t);
    const rightMaltB = smoothstep(T3_CUT0 + 1.9, T3_CUT0 + 2.7, t);

    // Hide purple fragments as they convert to green maltose
    const leftFragAlpha = 1 - smoothstep(T2_CUT0 + 1.5, T2_CUT0 + 2.4, t);
    const rightFragAlpha = 1 - smoothstep(T3_CUT0 + 1.5, T3_CUT0 + 2.4, t);

    function unitXs(cx, n, gap, extraMidGap) {
      // extraMidGap: extra space inserted after bond index 1 (middle of tetramer)
      const mid = Math.floor((n - 1) / 2); // 1 for n=4
      const total = (n - 1) * gap + (extraMidGap || 0);
      const x0 = cx - total / 2;
      const xs = [];
      let x = x0;
      for (let i = 0; i < n; i++) {
        xs.push(x);
        if (i < n - 1) x += gap + (i === mid ? (extraMidGap || 0) : 0);
      }
      return xs;
    }

    function drawBondLine(x1, y1, x2, y2, highlight) {
      ctx.strokeStyle = highlight ? "#c0392b" : "#5a3d8a";
      ctx.lineWidth = (highlight ? 9 : 5) * SCALE;
      ctx.lineCap = "round";
      if (highlight) {
        ctx.shadowColor = "rgba(192,57,43,0.55)";
        ctx.shadowBlur = 12;
      }
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawPurpleUnits(xs, y) {
      for (let i = 0; i < xs.length; i++) {
        drawHex(xs[i], y, R, "#7b5ea7", "#5a3d8a");
      }
    }

    function drawFragmentCutFX(xs, y, midBond, cutProg) {
      // midBond: bond index being cut (1 for tetramer)
      if (cutProg <= 0.12) return;
      const xL = xs[midBond];
      const xR = xs[midBond + 1];
      const mx = (xL + xR) / 2;
      if (cutProg > 0.2 && cutProg < 0.95) {
        const stub = 8 + 5 * (1 - cutProg);
        ctx.strokeStyle = "#c0392b";
        ctx.lineWidth = 7 * SCALE;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(xL, y);
        ctx.lineTo(xL + stub, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(xR - stub, y);
        ctx.lineTo(xR, y);
        ctx.stroke();
      }
      drawCutMark(mx, y, cutProg);
    }

    // ---- Draw starch: intact 8, then two tetramers, then splitting ----
    if (t < T1_CUT0 + 0.45) {
      // Intact / just-snapping 8-unit chain (extra gap at middle as it opens)
      const xs = unitXs(baseCx, 8, GAP, sep1);
      const hiMid = t >= T1_CUT0 - 0.35 && cut1 < 0.55;
      const omitMid = cut1 > 0.35;
      for (let i = 0; i < 7; i++) {
        if (omitMid && i === 3) continue;
        drawBondLine(xs[i], cy, xs[i + 1], cy, hiMid && i === 3);
      }
      drawPurpleUnits(xs, cy);
      if (cut1 > 0.12) drawFragmentCutFX(xs, cy, 3, cut1);
    } else {
      // Two tetramers (may still be cutting / converting)
      if (leftFragAlpha > 0.02) {
        ctx.globalAlpha = leftFragAlpha;
        const lxs = unitXs(leftCx, 4, GAP, leftPairSep);
        const hiL = t >= T2_CUT0 - 0.25 && cut2 < 0.55;
        const omitL = cut2 > 0.4;
        for (let i = 0; i < 3; i++) {
          if (omitL && i === 1) continue;
          drawBondLine(lxs[i], leftCy, lxs[i + 1], leftCy, hiL && i === 1);
        }
        drawPurpleUnits(lxs, leftCy);
        if (t >= T2_CUT0 && cut2 < 0.98) drawFragmentCutFX(lxs, leftCy, 1, cut2);
        ctx.globalAlpha = 1;
      }
      if (rightFragAlpha > 0.02) {
        ctx.globalAlpha = rightFragAlpha;
        const rxs = unitXs(rightCx, 4, GAP, rightPairSep);
        const hiR = t >= T3_CUT0 - 0.25 && cut3 < 0.55;
        const omitR = cut3 > 0.4;
        for (let i = 0; i < 3; i++) {
          if (omitR && i === 1) continue;
          drawBondLine(rxs[i], rightCy, rxs[i + 1], rightCy, hiR && i === 1);
        }
        drawPurpleUnits(rxs, rightCy);
        if (t >= T3_CUT0 && cut3 < 0.98) drawFragmentCutFX(rxs, rightCy, 1, cut3);
        ctx.globalAlpha = 1;
      }
    }

    // ---- Maltose products from each half ----
    function drawMaltoseFade(x, y, fade, phase) {
      if (fade <= 0) return;
      const bob = Math.sin(t * 2.0 + phase) * 6;
      const pop = 0.75 + 0.25 * fade;
      ctx.globalAlpha = fade;
      ctx.save();
      ctx.translate(x, y + bob);
      ctx.scale(pop * 1.1, pop * 1.1);
      drawMaltose(0, 0, 1);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // Left half → two pairs (inner positions of left tetramer)
    drawMaltoseFade(leftCx - GAP * 0.7 - leftPairSep * 0.35, leftCy, leftMaltA, 0.2);
    drawMaltoseFade(leftCx + GAP * 0.7 + leftPairSep * 0.35, leftCy, leftMaltB, 1.1);
    // Right half → two pairs
    drawMaltoseFade(rightCx - GAP * 0.7 - rightPairSep * 0.35, rightCy, rightMaltA, 2.0);
    drawMaltoseFade(rightCx + GAP * 0.7 + rightPairSep * 0.35, rightCy, rightMaltB, 2.8);

    // ---- Single amylase path (one instance) ----
    // Waypoints: start right → dock mid-8 → left tetramer mid → right tetramer mid → rest
    const mid8X = baseCx;
    const mid8Y = cy - 78;
    const leftMidX = leftCx;
    const leftMidY = leftCy - 78;
    const rightMidX = rightCx;
    const rightMidY = rightCy - 78;
    const restX = W * 0.86;
    const restY = H * 0.42;

    let ex, ey;
    if (t < T1_APPROACH) {
      const a = smoothstep(0, T1_APPROACH, t);
      ex = W * 0.88 + (mid8X - W * 0.88) * a;
      ey = cy + Math.sin(t * 1.6) * 6 * (1 - a) + (mid8Y - cy) * a;
    } else if (t < T2_MOVE0) {
      ex = (leftCx + rightCx) / 2;
      ey = mid8Y + Math.sin(t * 4) * 3;
    } else if (t < T2_CUT0) {
      const a = smoothstep(T2_MOVE0, T2_CUT0, t);
      const fromX = (leftCx + rightCx) / 2;
      const fromY = mid8Y;
      ex = fromX + (leftMidX - fromX) * a;
      ey = fromY + (leftMidY - fromY) * a;
    } else if (t < T3_MOVE0) {
      ex = leftMidX;
      ey = leftMidY + Math.sin(t * 5) * 4;
    } else if (t < T3_CUT0) {
      const a = smoothstep(T3_MOVE0, T3_CUT0, t);
      ex = leftMidX + (rightMidX - leftMidX) * a;
      ey = leftMidY + (rightMidY - leftMidY) * a;
    } else if (t < HOLD) {
      ex = rightMidX;
      ey = rightMidY + Math.sin(t * 5) * 4;
    } else {
      const a = smoothstep(HOLD, HOLD + 1.2, t);
      ex = rightMidX + (restX - rightMidX) * a;
      ey = rightMidY + (restY - rightMidY) * a;
    }

    const cutting =
      (t >= T1_CUT0 && t < T1_CUT1) ||
      (t >= T2_CUT0 && t < T2_CUT1) ||
      (t >= T3_CUT0 && t < T3_CUT1);
    const pulseAmp = cutting ? 0.12 : 0.05;
    const pulse = 1 + pulseAmp * Math.sin(t * (cutting ? 5 : 2.2));
    const showFullLabel = t >= HOLD + 0.4;
    ctx.save();
    ctx.translate(ex, ey);
    ctx.scale(pulse, pulse);
    ctx.translate(-ex, -ey);
    drawEnzyme(ex, ey, showFullLabel ? "澱粉酶" : null);
    ctx.restore();
    if (!showFullLabel) {
      ctx.fillStyle = "#c45f0e";
      ctx.font = "bold 20px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("澱粉酶", ex, ey + 52);
      ctx.font = "15px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
      ctx.fillStyle = "#5a6a7a";
      ctx.fillText("amylase", ex, ey + 72);
    }

    // ---- Callouts ----
    if (t < T1_CUT0) {
      drawCallout(W * 0.5, H * 0.78, "澱粉酶對準中間的化學鍵", "#e67e22", 28);
      drawFootnote(W * 0.5, H * 0.88, "同一粒酶會再切兩邊的片段");
    } else if (t < T2_MOVE0) {
      drawCallout(W * 0.72, H * 0.72, "切斷！變成兩邊各四單位", "#c0392b", 26);
      drawFootnote(W * 0.72, H * 0.82, "鏈慢慢分開");
    } else if (t < T2_CUT0) {
      drawCallout(W * 0.28, H * 0.78, "移去左邊：對準中間鍵", "#e67e22", 24);
      drawFootnote(W * 0.28, H * 0.88, "四單位 → 準備拆成兩個兩個");
    } else if (t < T3_MOVE0) {
      drawCallout(W * 0.28, H * 0.78, "切開左邊 → 兩個麥芽糖", "#27ae60", 24);
      drawFootnote(W * 0.28, H * 0.88, "四單位拆成 2＋2");
    } else if (t < T3_CUT0) {
      drawCallout(W * 0.72, H * 0.78, "同一粒酶移去右邊", "#e67e22", 24);
      drawFootnote(W * 0.72, H * 0.88, "再切另一邊的中間鍵");
    } else if (t < HOLD) {
      drawCallout(W * 0.72, H * 0.78, "切開右邊 → 兩個麥芽糖", "#27ae60", 24);
      drawFootnote(W * 0.72, H * 0.88, "四單位拆成 2＋2");
    } else {
      drawCallout(W * 0.42, H * 0.78, "澱粉 → 四分子麥芽糖", "#27ae60", 28);
      drawFootnote(W * 0.42, H * 0.88, "較簡單物質 · 課文常寫可進一步成葡萄糖");
    }
  }

  function drawScene3(t) {
    // Two-column comparison
    // Left: mechanical
    roundRect(60, 100, W * 0.42 - 40, H - 200, 16);
    ctx.fillStyle = "rgba(232,240,250,0.9)";
    ctx.fill();
    ctx.strokeStyle = "#2c5aa0";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "#2c5aa0";
    ctx.font = "bold 30px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("機械消化", W * 0.25, 150);
    ctx.font = "22px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
    ctx.fillStyle = "#5a6a7a";
    ctx.fillText("只改大小／形狀", W * 0.25, 185);

    // Same color blobs = same substance
    drawHex(W * 0.18, 320, 28, "#7b5ea7");
    drawHex(W * 0.25, 320, 28, "#7b5ea7");
    drawHex(W * 0.32, 320, 28, "#7b5ea7");
    ctx.fillStyle = "#2e7d4f";
    ctx.font = "bold 24px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
    ctx.fillText("不產生新物質", W * 0.25, 420);
    ctx.fillText("化學結構不變", W * 0.25, 455);

    // Right: chemical
    roundRect(W * 0.52, 100, W * 0.42 - 20, H - 200, 16);
    ctx.fillStyle = "rgba(255,245,235,0.95)";
    ctx.fill();
    ctx.strokeStyle = "#e67e22";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "#e67e22";
    ctx.font = "bold 30px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
    ctx.fillText("化學消化", W * 0.72, 150);
    ctx.font = "22px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
    ctx.fillStyle = "#5a6a7a";
    ctx.fillText("改變化學結構", W * 0.72, 185);

    // Before → after
    drawStarchChain(W * 0.72, 280, 5, 36, 0.75, null);
    ctx.fillStyle = "#7b5ea7";
    ctx.font = "bold 18px 'Noto Sans TC', sans-serif";
    ctx.fillText("澱粉", W * 0.72, 330);

    const pulse = 0.85 + 0.15 * Math.sin(t * 3);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = "#c0392b";
    ctx.font = "bold 28px 'Noto Sans TC', sans-serif";
    ctx.fillText("↓ 產生新物質", W * 0.72, 370);
    ctx.globalAlpha = 1;

    drawMaltose(W * 0.65, 430, 1);
    drawMaltose(W * 0.79, 430, 1);
    ctx.fillStyle = "#27ae60";
    ctx.font = "bold 18px 'Noto Sans TC', sans-serif";
    ctx.fillText("麥芽糖（較簡單物質）", W * 0.72, 480);

    drawCallout(W * 0.5, H * 0.9, "化學消化：澱粉＋澱粉酶 → 新物質", "#c0392b", 26);
  }

  function drawScene4(t) {
    ctx.fillStyle = "#2c5aa0";
    ctx.font = "bold 32px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("碘液測試（實驗12.8 概念）", W * 0.5, 70);

    // Left tube: starch present, no enzyme / control → blue-black
    const shimmer = Math.sin(t * 2) * 0.03;
    drawTestTube(
      W * 0.28, 140,
      "rgb(" + Math.floor(20 + shimmer * 10) + "," + Math.floor(20 + shimmer * 5) + "," + Math.floor(45 + shimmer * 20) + ")",
      "有澱粉＋碘液",
      "藍黑色"
    );

    // Badge: 無酶／對照
    roundRect(W * 0.28 - 90, 110, 180, 28, 6);
    ctx.fillStyle = "#c0392b";
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 18px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("對照：無酶／仍有澱粉", W * 0.28, 130);

    // Right tube: digested → iodine pale yellow/brown
    drawTestTube(
      W * 0.72, 140,
      "#e8c84a",
      "已分解＋碘液",
      "唔變藍黑（黃／啡）"
    );

    roundRect(W * 0.72 - 100, 110, 200, 28, 6);
    ctx.fillStyle = "#27ae60";
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 18px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
    ctx.fillText("有澱粉酶 → 澱粉已分解", W * 0.72, 130);

    // Mini icons under tubes
    ctx.fillStyle = "#7b5ea7";
    ctx.font = "bold 20px 'Noto Sans TC', sans-serif";
    ctx.fillText("仍是澱粉", W * 0.28, 430);
    drawStarchChain(W * 0.28, 470, 4, 32, 0.65, null);

    ctx.fillStyle = "#27ae60";
    ctx.fillText("變成麥芽糖／糖", W * 0.72, 430);
    drawMaltose(W * 0.66, 470, 0.9);
    drawMaltose(W * 0.78, 470, 0.9);

    // Bottom summary
    const blink = 0.75 + 0.25 * Math.sin(t * 2.5);
    ctx.globalAlpha = blink;
    drawCallout(W * 0.5, H * 0.88, "無酶：藍黑｜有酶分解後：唔變藍黑", "#2c5aa0", 28);
    ctx.globalAlpha = 1;
  }

  function drawScene() {
    ctx.clearRect(0, 0, W, H);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#eef4fb");
    bg.addColorStop(0.5, "#f8fafc");
    bg.addColorStop(1, "#eef4fb");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const t = sceneT;
    if (sceneIndex === 0) drawScene1(t);
    else if (sceneIndex === 1) drawScene2(t);
    else if (sceneIndex === 2) drawScene3(t);
    else drawScene4(t);

    ctx.fillStyle = "rgba(44,90,160,0.9)";
    roundRect(W - 160, 20, 140, 36, 8);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 20px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("步驟 " + (sceneIndex + 1) + " / 4", W - 90, 44);
  }

  function loop(now) {
    if (playing) {
      sceneT = (now - t0) / 1000;
    } else {
      t0 = now - sceneT * 1000;
    }
    drawScene();
    requestAnimationFrame(loop);
  }

  btnPlay.addEventListener("click", function () {
    playing = !playing;
    if (playing) t0 = performance.now() - sceneT * 1000;
    updateUI();
  });
  document.getElementById("btnPrev").addEventListener("click", function () { goScene(sceneIndex - 1); });
  document.getElementById("btnNext").addEventListener("click", function () { goScene(sceneIndex + 1); });
  document.getElementById("btnRestart").addEventListener("click", restartScene);

  window.addEventListener("keydown", function (e) {
    if (e.code === "ArrowLeft") { e.preventDefault(); goScene(sceneIndex - 1); }
    else if (e.code === "ArrowRight") { e.preventDefault(); goScene(sceneIndex + 1); }
    else if (e.code === "Space") {
      e.preventDefault();
      playing = !playing;
      if (playing) t0 = performance.now() - sceneT * 1000;
      updateUI();
    } else if (e.code === "KeyR") { restartScene(); }
  });

  updateUI();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
