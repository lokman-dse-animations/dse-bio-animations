<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中三物理 — 教學動畫</title>
<style>
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --ink: #1a2332;
    --muted: #5a6a7a;
    --accent: #1e6b4f;
    --accent-soft: #e6f4ee;
    --border: #d0dae6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background:
      radial-gradient(1200px 500px at 10% -10%, #d9efe6 0%, transparent 55%),
      radial-gradient(900px 400px at 100% 0%, #dce8f8 0%, transparent 50%),
      var(--bg);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
  }
  .top {
    max-width: 760px;
    margin: 0 auto;
    padding: 1.25rem 1.25rem 0;
  }
  .top a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .top a:hover { text-decoration: underline; }
  header {
    padding: 1.5rem 1.25rem 1.5rem;
    text-align: center;
  }
  .badge {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 0.3rem 0.7rem;
    border-radius: 999px;
    margin-bottom: 0.85rem;
  }
  header h1 {
    margin: 0 0 0.45rem;
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 800;
  }
  header p {
    margin: 0 auto;
    max-width: 34rem;
    color: var(--muted);
    font-size: 1.02rem;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 1.25rem 2.5rem;
  }
  h2.section {
    margin: 0 0 0.85rem;
    font-size: 1.05rem;
    color: var(--muted);
    font-weight: 700;
  }
  .grid { display: grid; gap: 1rem; }
  a.card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.2rem 1.35rem;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 2px rgba(26, 35, 50, 0.04);
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  a.card:hover {
    border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(30, 107, 79, 0.12);
    transform: translateY(-1px);
  }
  .card h3 {
    margin: 0 0 0.3rem;
    font-size: 1.15rem;
    color: var(--accent);
  }
  .card p {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
  }
  .meta {
    margin-top: 0.7rem;
    font-size: 0.8rem;
    color: var(--accent);
    font-weight: 600;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 0 1rem 2.25rem;
  }
</style>
</head>
<body>
  <div class="top"><a href="index.html">← 返回年級科目</a></div>
  <header>
    <div class="badge">中三 · 物理</div>
    <h1>揀動畫</h1>
    <p>光、力與其他課題的互動示意，之後會陸續加入。</p>
  </header>
  <main>
    <h2 class="section">光</h2>
    <div class="grid">
      <a class="card" href="light-shadow.html">
        <h3>光的直線傳播：影子大小</h3>
        <p>燈泡距離與影子形成——燈泡越遠，影子會怎樣？</p>
        <div class="meta">打開動畫 →</div>
      </a>
      <a class="card" href="plane-mirror.html">
        <h3>平面鏡成像：光線圖</h3>
        <p>活動 14.8——以光線圖逐步繪畫平面鏡的成像（對應課本）。</p>
        <div class="meta">打開動畫 →</div>
      </a>
    </div>
  </main>
  <footer>教學用途 · 用 Chrome 或 Safari 打開效果最佳</footer>
</body>
</html>
