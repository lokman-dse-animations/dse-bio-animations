  'use strict';

  const COL = {

    paperEdge: '#8fb4d8'

  const AUTO_HOLD_MS = 1800;

  const hypot = Math.hypot;
  function add(a, b) { return { x: a.x + b.x, y: a.y + b.y }; }
  function sub(a, b) { return { x: a.x - b.x, y: a.y - b.y }; }
  function mul(a, s) { return { x: a.x * s, y: a.y * s }; }
  function len(a) { return hypot(a.x, a.y) || 1e-9; }
  function norm(a) { const L = len(a); return { x: a.x / L, y: a.y / L }; }
  function lerp(a, b, t) { return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function deg(rad) { return rad * 180 / Math.PI; }
  function rad(d) { return d * Math.PI / 180; }

  const I_DEG = 60;
  const I_ANG = rad(I_DEG);

  const MEDIA = {
    air: {
      id: 'air', n: 1.0003, name: '空氣', short: '空氣',
      rLabel: '約 60°', rShort: '≈ 60°', kind: 'air',
      fill: 'rgba(200,220,255,0.06)', stroke: '#9eb0c8',

      fill: 'rgba(64,168,255,0.38)', stroke: '#7fdcff',
      liquid: 'rgba(70,170,255,0.48)',
      ghost: 'rgba(100,190,255,0.55)'
    },
    oil: {
      id: 'oil', n: 1.46, name: '嬰兒潤滑油', short: '潤滑油',
      rLabel: '約 36°', rShort: '≈ 36°', kind: 'liquid',
      fill: 'rgba(240,200,70,0.38)', stroke: '#ffd84a',
      liquid: 'rgba(236,196,60,0.50)',
      ghost: 'rgba(240,200,80,0.55)'
    },
    perspex: {
      id: 'perspex', n: 1.50, name: '有機玻璃', short: '有機玻璃',

      fill: 'rgba(150,200,185,0.42)', stroke: '#b8ddd0',

    },
    diamond: {
      id: 'diamond', n: 2.42, name: '鑽石', short: '鑽石',
      rLabel: '約 21°', rShort: '≈ 21°', kind: 'solid',
      fill: 'rgba(180,230,255,0.34)', stroke: '#e8f6ff',
      ghost: 'rgba(200,230,255,0.55)'
    }
  };

  function refractRad(n) {
    const s = Math.sin(I_ANG) / n;
    return Math.asin(Math.min(1, Math.max(-1, s)));
  }

  // 長方形介質（世界座標，y 向上）。寬度與高度令 i=60° 的未偏折線剛好在右下角附近離開。
  const BOX = { L: 0, R: 5.4, B: 0, T: 10.2 };
  const P_IN = { x: BOX.L, y: 9.50 };
  const WIDTH = BOX.R - BOX.L;
  const INC_DIR = { x: Math.cos(-I_ANG), y: Math.sin(-I_ANG) };
  const INC_BACK = 4.9;
  const P_START = { x: P_IN.x - INC_DIR.x * INC_BACK, y: P_IN.y - INC_DIR.y * INC_BACK };
  const EXIT_LEN = 4.4;

  function geomFor(n) {
    const r = refractRad(n);
    const refDir = { x: Math.cos(-r), y: Math.sin(-r) };
    const pOut = { x: BOX.R, y: P_IN.y - WIDTH * Math.tan(r) };
    const pEnd = { x: pOut.x + INC_DIR.x * EXIT_LEN, y: pOut.y + INC_DIR.y * EXIT_LEN };
    const x1 = { x: pOut.x + INC_DIR.x * 1.25, y: pOut.y + INC_DIR.y * 1.25 };
    const x2 = { x: pOut.x + INC_DIR.x * 2.7, y: pOut.y + INC_DIR.y * 2.7 };
    const undefOut = { x: BOX.R, y: P_IN.y - WIDTH * Math.tan(I_ANG) };
    const undefEnd = { x: undefOut.x + INC_DIR.x * 2.4, y: undefOut.y + INC_DIR.y * 2.4 };
    return { r, rDeg: deg(r), refDir, pOut, pEnd, x1, x2, undefOut, undefEnd };
  }

        },
        {

        {

  // =========================================================
  // 狀態與介面
  // =========================================================
  const state = {
    scene: 0,
    step: 0,
    showNormal: true,
    showAngles: true,
    showGrid: true,
    showStraight: true,
    showGhost: true,
    autoplay: false,
    progress: 1,
    animating: false,
    lastTs: null,
    medium: 'water',
    boxShift: 0,
    darkLab: 0
  };
  let holdUntil = 0;

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const stepsEl = document.getElementById('steps');
  const stepTitle = document.getElementById('stepTitle');
  const stepDesc = document.getElementById('stepDesc');
  const conclusion = document.getElementById('conclusion');
  const formula = document.getElementById('formula');
  const btnAuto = document.getElementById('btnAuto');
  const headerSub = document.getElementById('headerSub');
  const mediaPanel = document.getElementById('mediaPanel');
  const mediaBtns = document.getElementById('mediaBtns');
  const ghostWrap = document.getElementById('ghostWrap');

  function currentScene() { return SCENES[state.scene]; }
  function currentSteps() { return currentScene().steps; }
  function currentStep() { return currentSteps()[state.step]; }
  function currentMedia() { return MEDIA[state.medium] || MEDIA.water; }

  function rebuildSteps() {
    stepsEl.innerHTML = '';
    currentSteps().forEach((s, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'step-btn' + (i === state.step ? ' active' : (i < state.step ? ' done' : ''));
      b.innerHTML = '<span class="num">' + i + '</span>' + s.sub;
      b.addEventListener('click', () => goStep(i, true));
      stepsEl.appendChild(b);
    });
  }

  function rebuildMediaBtns() {
    const set = currentScene().mediaSet;
    mediaBtns.innerHTML = '';
    if (!set) return;
    set.forEach(id => {
      const m = MEDIA[id];
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'media-btn' + (state.medium === id ? ' active' : '');
      b.textContent = m.name;
      b.addEventListener('click', () => {
        state.medium = id;
        rebuildMediaBtns();
        updateUI();
      });
      mediaBtns.appendChild(b);
    });
  }

  function applyStepDefaults(s) {
    if (s.medium) state.medium = s.medium;
    if (s.showGhost) state.showGhost = true;
  }

  function updateUI() {
    const scene = currentScene();
    const s = scene.steps[state.step];
    stepTitle.textContent = s.title;
    stepDesc.innerHTML = s.desc;
    conclusion.textContent = s.footer;
    const med = currentMedia();
    const rInfo = '　｜　' + med.name + '　n = ' + (med.id === 'glass' ? '1.60（1.50–1.70）' : String(med.n)) +
      '　r = ' + med.rLabel;
    formula.textContent = scene.formulaDefault + (scene.mediaSet ? rInfo : '');
    headerSub.textContent = '中三物理 · 光　｜　' + scene.headerSub;
    [...stepsEl.children].forEach((el, i) => {
      el.classList.toggle('active', i === state.step);
      el.classList.toggle('done', i < state.step);
    });
    document.querySelectorAll('.scene-btn').forEach((el, i) => {
      el.classList.toggle('active', i === state.scene);
    });
    const atEnd = state.step === scene.steps.length - 1 && state.progress >= 1;
    document.getElementById('btnPrev').disabled = state.step === 0;
    document.getElementById('btnPrev2').disabled = state.step === 0;
    document.getElementById('btnNext').disabled = atEnd && !state.autoplay;
    document.getElementById('btnNext2').disabled = atEnd && !state.autoplay;
    btnAuto.textContent = state.autoplay ? '⏸ 暫停' : '▶ 自動播放';
    const hasMedia = !!scene.mediaSet;
    mediaPanel.hidden = !hasMedia;
    ghostWrap.hidden = scene.id === 'A';
    if (hasMedia) {
      [...mediaBtns.children].forEach((el, i) => {
        el.classList.toggle('active', scene.mediaSet[i] === state.medium);
      });
    }
  }

  function goScene(i, replayAnim) {
    i = clamp(i | 0, 0, SCENES.length - 1);
    state.scene = i;
    state.autoplay = false;
    state.medium = SCENES[i].defaultMedium || 'water';
    rebuildSteps();
    rebuildMediaBtns();
    goStep(0, !!replayAnim);
    if (!replayAnim) {
      state.progress = 1;
      state.animating = false;
      finishAnimExtras();
    }
    updateUI();
  }

  function finishAnimExtras() {
    const anim = currentStep().anim;
    if (anim === 'remove' || anim === 'measure') state.boxShift = 1;
    else state.boxShift = 0;
    if (anim === 'dark' || anim === 'enter' || anim === 'exitX' || anim === 'join') state.darkLab = 1;
    else if (anim === 'remove' || anim === 'measure') state.darkLab = 0.15;
    else state.darkLab = 0;
  }

  function startAnimExtras() {
    const anim = currentStep().anim;
    if (anim === 'remove') state.boxShift = 0;
    if (anim === 'dark') state.darkLab = 0;
  }

  function goStep(i, replayAnim) {
    const steps = currentSteps();
    i = clamp(i, 0, steps.length - 1);
    state.step = i;
    applyStepDefaults(steps[i]);
    rebuildMediaBtns();
    const needsAnim = steps[i].anim !== 'none';
    if (replayAnim && needsAnim) {
      state.progress = 0;
      state.animating = true;
      state.lastTs = null;
      startAnimExtras();
    } else {
      state.progress = 1;
      state.animating = false;
      finishAnimExtras();
    }
    holdUntil = 0;
    updateUI();
  }

  function nextStep() {
    const steps = currentSteps();
    if (state.step >= steps.length - 1 && state.progress >= 1) {
      state.autoplay = false;
      updateUI();
      return;
    }
    if (state.progress < 1) {
      state.progress = 1;
      state.animating = false;
      finishAnimExtras();
      updateUI();
      return;
    }
    goStep(state.step + 1, true);
  }

  function prevStep() {
    state.autoplay = false;
    if (state.progress < 1 && state.step > 0) {
      goStep(state.step, false);
      return;
    }
    goStep(Math.max(0, state.step - 1), false);
  }

  function replay() {
    state.autoplay = false;
    state.medium = currentScene().defaultMedium || 'water';
    goStep(0, true);
    state.progress = 1;
    state.animating = false;
    finishAnimExtras();
    updateUI();
  }

  function toggleAuto() {
    state.autoplay = !state.autoplay;
    if (state.autoplay) {
      const steps = currentSteps();
      if (state.step === steps.length - 1 && state.progress >= 1) {
        goStep(0, true);
        state.progress = 1;
        state.animating = false;
        finishAnimExtras();
        holdUntil = performance.now() + 800;
      } else if (state.progress >= 1) {
        holdUntil = performance.now() + 400;
      } else {
        state.animating = true;
        state.lastTs = null;
      }
    }
    updateUI();
  }

  // =========================================================
  // 繪圖：相機與原語
  // =========================================================
  let W = 0, H = 0, dpr = 1;
  let scale = 1, ox = 0, oy = 0;

  function resize() {
    const rect = cv.parentElement.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.floor(rect.width));
    H = Math.max(1, Math.floor(rect.height));
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function setWorld(xmin, xmax, ymin, ymax, pad, view) {
    pad = pad == null ? 0.08 : pad;
    view = view || { x: 0, y: 0, w: 1, h: 1 };
    const vx = W * view.x, vy = H * view.y, vw = W * view.w, vh = H * view.h;
    const wx = xmax - xmin, wy = ymax - ymin;
    scale = Math.min(vw * (1 - 2 * pad) / wx, vh * (1 - 2 * pad) / wy);
    ox = vx + vw / 2 - (xmin + xmax) / 2 * scale;
    oy = vy + vh / 2 + (ymin + ymax) / 2 * scale;
  }
  function tx(x) { return ox + x * scale; }
  function ty(y) { return oy - y * scale; }
  function lw(n) { return Math.max(1.2, n * scale / 18); }
  function fs(n) { return Math.max(12, n * scale / 18); }

  function drawArrowHead(x1, y1, x2, y2, color, size) {
    const px1 = tx(x1), py1 = ty(y1), px2 = tx(x2), py2 = ty(y2);
    const ang = Math.atan2(py2 - py1, px2 - px1);
    const s = size || Math.max(9, 11 * scale / 28);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(px2, py2);
    ctx.lineTo(px2 - s * Math.cos(ang - 0.4), py2 - s * Math.sin(ang - 0.4));
    ctx.lineTo(px2 - s * Math.cos(ang + 0.4), py2 - s * Math.sin(ang + 0.4));
    ctx.closePath();
    ctx.fill();
  }

  function drawSolidRay(x1, y1, x2, y2, color, width, withArrow, t) {
    t = t == null ? 1 : clamp(t, 0, 1);
    if (t <= 0) return;
    const x = x1 + (x2 - x1) * t;
    const y = y1 + (y2 - y1) * t;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.setLineDash([]);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(tx(x1), ty(y1));
    ctx.lineTo(tx(x), ty(y));
    ctx.stroke();
    if (withArrow && t > 0.08) {
      const midT = Math.min(t, 0.55);
      if (t >= 0.45) {
        const mx = x1 + (x2 - x1) * midT;
        const my = y1 + (y2 - y1) * midT;
        const mx0 = x1 + (x2 - x1) * (midT - 0.02);
        const my0 = y1 + (y2 - y1) * (midT - 0.02);
        drawArrowHead(mx0, my0, mx, my, color, Math.max(8, 10 * scale / 28));
      }
      drawArrowHead(x1, y1, x, y, color, Math.max(9, 11 * scale / 28));
    }
  }

  function drawDashed(x1, y1, x2, y2, color, width, t) {
    t = t == null ? 1 : clamp(t, 0, 1);
    if (t <= 0) return;
    const x = x1 + (x2 - x1) * t;
    const y = y1 + (y2 - y1) * t;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.setLineDash([8, 7]);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tx(x1), ty(y1));
    ctx.lineTo(tx(x), ty(y));
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawPolyline(pts, color, width, withArrow, t, dashed) {
    t = t == null ? 1 : clamp(t, 0, 1);
    if (t <= 0 || pts.length < 2) return;
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const L = len(sub(pts[i + 1], pts[i]));
      segs.push(L);
      total += L;
    }
    let remain = total * t;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.setLineDash(dashed ? [8, 7] : []);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(tx(pts[0].x), ty(pts[0].y));
    let last = pts[0], prev = pts[0];
    const midPts = [];
    let acc0 = 0;
    for (let i = 0; i < segs.length; i++) {
      if (remain <= 0) break;
      const a = pts[i], b = pts[i + 1];
      const L = segs[i];
      const use = Math.min(L, remain);
      const p = lerp(a, b, use / L);
      ctx.lineTo(tx(p.x), ty(p.y));
      prev = last;
      last = p;
      remain -= use;
      if (use >= L * 0.55) {
        midPts.push([lerp(a, b, 0.48), lerp(a, b, 0.55)]);
      }
      acc0 += use;
    }
    ctx.stroke();
    ctx.setLineDash([]);
    if (withArrow && t > 0.1) {
      drawArrowHead(prev.x, prev.y, last.x, last.y, color, Math.max(9, 11 * scale / 28));
      if (t > 0.5) {
        midPts.forEach(pair => {
          drawArrowHead(pair[0].x, pair[0].y, pair[1].x, pair[1].y, color, Math.max(8, 10 * scale / 28));
        });
      }
    }
  }

  function drawLabel(text, x, y, color, fontSize, align, baseline) {
    ctx.fillStyle = color || '#fff';
    ctx.font = 'bold ' + (fontSize || Math.max(14, fs(16))) + 'px "Microsoft JhengHei", "PingFang HK", "Noto Sans CJK HK", sans-serif';
    ctx.textAlign = align || 'center';
    ctx.textBaseline = baseline || 'middle';
    ctx.fillText(text, tx(x), ty(y));
  }

  function drawLabelPx(text, px, py, color, fontSize, align, baseline) {
    ctx.fillStyle = color || '#fff';
    ctx.font = 'bold ' + (fontSize || 16) + 'px "Microsoft JhengHei", "PingFang HK", "Noto Sans CJK HK", sans-serif';
    ctx.textAlign = align || 'center';
    ctx.textBaseline = baseline || 'middle';
    ctx.fillText(text, px, py);
  }

  function drawDot(p, color, r) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(tx(p.x), ty(p.y), r || Math.max(3.5, 4.2 * scale / 28), 0, Math.PI * 2);
    ctx.fill();
  }

  function roundRect(c, x, y, w, h, r) {
    const rr = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  function drawGridWorld(xmin, xmax, ymin, ymax, step, alpha) {
    if (!state.showGrid) return;
    ctx.strokeStyle = 'rgba(127,220,255,' + (alpha == null ? 0.10 : alpha) + ')';
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
    for (let x = xmin; x <= xmax + 1e-6; x += step) {
      ctx.beginPath();
      ctx.moveTo(tx(x), ty(ymin));
      ctx.lineTo(tx(x), ty(ymax));
      ctx.stroke();
    }
    for (let y = ymin; y <= ymax + 1e-6; y += step) {
      ctx.beginPath();
      ctx.moveTo(tx(xmin), ty(y));
      ctx.lineTo(tx(xmax), ty(y));
      ctx.stroke();
    }
  }


  function pixAngAt(hit, v) {
    const p0 = { x: tx(hit.x), y: ty(hit.y) };
    const p1 = { x: tx(hit.x + v.x), y: ty(hit.y + v.y) };
    return Math.atan2(p1.y - p0.y, p1.x - p0.x);
  }

  function drawRightAngleMark(hit, nDir, ifaceDir, size) {
    if (!state.showNormal) return;
    const s = size || 0.32;
    const a = add(hit, mul(nDir, s));
    const b = add(a, mul(ifaceDir, s));
    const c = add(hit, mul(ifaceDir, s));
    ctx.strokeStyle = '#b8ecff';
    ctx.lineWidth = Math.max(2.0, lw(2.2));
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(tx(a.x), ty(a.y));
    ctx.lineTo(tx(b.x), ty(b.y));
    ctx.lineTo(tx(c.x), ty(c.y));
    ctx.stroke();
  }

  function drawNormalAt(hit, nDir, lenN, t, label, ifaceUp) {
    if (!state.showNormal) return;
    t = t == null ? 1 : t;
    if (t <= 0) return;
    const L = (lenN || 2.2) * t;
    const a = add(hit, mul(nDir, L));
    const b = add(hit, mul(nDir, -L));
    ctx.strokeStyle = COL.N;
    ctx.lineWidth = Math.max(1.4, lw(1.8));
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.moveTo(tx(a.x), ty(a.y));
    ctx.lineTo(tx(b.x), ty(b.y));
    ctx.stroke();
    ctx.setLineDash([]);
    // 直角記號畫在空氣一側、入射線的對面（法線下方），減少與 i 角弧重疊
    if (t > 0.5) {
      const airN = nDir; // 傳入時以指向空氣為正
      const up = ifaceUp || { x: 0, y: 1 };
      drawRightAngleMark(hit, mul(airN, 1), mul(up, -1), 0.42);
    }
    if (state.showAngles && t > 0.7 && label !== false) {
      // 標在介質一側、法線上方，避免與空氣一側的入射角標籤重疊
      const lp = add(add(hit, mul(nDir, -(L + 0.05))), { x: 0, y: 0.40 });
      drawLabel('法線', lp.x, lp.y, COL.acc, fs(15));
    }
  }

  function drawAngleArc(hit, fromVec, toVec, radius, color, label, labelR, t) {
    if (!state.showAngles) return;
    t = t == null ? 1 : t;
    if (t < 0.4) return;
    const a0 = pixAngAt(hit, fromVec);
    const a1 = pixAngAt(hit, toVec);
    let d = a1 - a0;
    while (d > Math.PI) d -= 2 * Math.PI;
    while (d < -Math.PI) d += 2 * Math.PI;
    const radPx = radius || Math.max(22, 28 * scale / 28);
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1.6, lw(1.8));
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(tx(hit.x), ty(hit.y), radPx, a0, a0 + d, d < 0);
    ctx.stroke();
    if (label) {
      const mid = a0 + d / 2;
      const lr = (labelR || radPx + 14);
      const lx = tx(hit.x) + Math.cos(mid) * lr;
      const ly = ty(hit.y) + Math.sin(mid) * lr;
      drawLabelPx(label, lx, ly, color, Math.max(15, fs(16)));
    }
  }

  function drawCross(p, color, size, t) {
    t = t == null ? 1 : t;
    if (t <= 0) return;
    const s = (size || 0.22) * t;
    ctx.strokeStyle = color || '#ff8a6a';
    ctx.lineWidth = Math.max(2.2, lw(2.6));
    ctx.setLineDash([]);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tx(p.x - s), ty(p.y - s));
    ctx.lineTo(tx(p.x + s), ty(p.y + s));
    ctx.moveTo(tx(p.x - s), ty(p.y + s));
    ctx.lineTo(tx(p.x + s), ty(p.y - s));
    ctx.stroke();
  }

  function drawBackground(dark) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    const k = dark || 0;
    const top = k > 0 ? 'rgb(' + Math.round(8 * (1 - k * 0.5)) + ',' + Math.round(16 * (1 - k * 0.4)) + ',' + Math.round(36 * (1 - k * 0.3)) + ')' : '#0b1730';
    const bot = k > 0 ? '#050914' : '#081022';
    g.addColorStop(0, top);
    g.addColorStop(1, bot);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawStepBadge(extra) {
    const scene = currentScene();
    const label = scene.id + (state.step) + (extra ? '　' + extra : '');
    const pad = 10, fsx = Math.max(13, Math.min(18, W / 70));
    ctx.font = 'bold ' + fsx + 'px "Microsoft JhengHei", "PingFang HK", sans-serif';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(8,16,34,0.72)';
    roundRect(ctx, 12, 12, tw + pad * 2, fsx + 14, 8);
    ctx.fill();
    ctx.strokeStyle = '#ffffff33';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#7fdcff';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, 12 + pad, 12 + (fsx + 14) / 2);
  }

  function drawPaper() {
    const x0 = -5.2, x1 = 11.2, y0 = -2.0, y1 = 16.2;
    const px = tx(x0), py = ty(y1), pw = tx(x1) - tx(x0), ph = ty(y0) - ty(y1);
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.45)';
    ctx.shadowBlur = 18;
    ctx.shadowOffsetY = 6;
    const dim = state.darkLab;
    ctx.fillStyle = dim > 0.5 ? '#0d1a30' : COL.paper;
    roundRect(ctx, px, py, pw, ph, 8);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = dim > 0.5 ? '#3a5478' : COL.paperEdge;
    ctx.lineWidth = Math.max(1.5, lw(1.6));
    roundRect(ctx, px, py, pw, ph, 8);
    ctx.stroke();
    const labY = y1 + 0.35;
    drawLabel('A4 紙', (x0 + x1) / 2, y1 + 0.42, dim > 0.5 ? '#6a80a0' : '#9eb0c8', fs(14));
    drawGridWorld(-4, 10.5, -1.5, 14.2, 1, dim > 0.5 ? 0.05 : 0.10);
  }

  function drawOutline(t) {
    t = t == null ? 1 : clamp(t, 0, 1);
    if (t <= 0) return;
    const L = BOX.L, R = BOX.R, B = BOX.B, T = BOX.T;
    // 按周長逐漸畫出鉛筆邊緣
    const pts = [
      { x: L, y: T }, { x: R, y: T }, { x: R, y: B }, { x: L, y: B }, { x: L, y: T }
    ];
    ctx.strokeStyle = '#d8e4f4';
    ctx.lineWidth = Math.max(1.8, lw(2.0));
    ctx.setLineDash([5, 4]);
    ctx.lineCap = 'round';
    drawPolyline(pts, '#d8e4f4', Math.max(1.8, lw(2.0)), false, t, true);
    if (t > 0.85) {
      drawLabel('容器邊緣', (L + R) / 2, B - 0.45, '#c8d6e8', fs(14));
    }
  }

  function drawLiquidSurface(L, R, Tliq, color) {
    ctx.strokeStyle = color || 'rgba(220,240,255,0.7)';
    ctx.lineWidth = Math.max(1.4, lw(1.6));
    ctx.setLineDash([]);
    ctx.beginPath();
    const mid = (L + R) / 2;
    ctx.moveTo(tx(L), ty(Tliq));
    ctx.quadraticCurveTo(tx(mid), ty(Tliq + 0.12), tx(R), ty(Tliq));
    ctx.stroke();
  }

  function drawBubbles(L, R, B, Tliq, color) {
    const bubbles = [
      { x: L + 0.7, y: B + 1.4, r: 0.10 },
      { x: L + 1.5, y: B + 2.8, r: 0.07 },
      { x: R - 1.1, y: B + 1.9, r: 0.09 },
      { x: R - 2.0, y: Tliq - 1.6, r: 0.06 },
      { x: L + 2.6, y: Tliq - 2.2, r: 0.08 }
    ];
    ctx.strokeStyle = color || 'rgba(255,255,255,0.35)';
    ctx.lineWidth = Math.max(1, lw(1.1));
    ctx.setLineDash([]);
    bubbles.forEach(b => {
      ctx.beginPath();
      ctx.arc(tx(b.x), ty(b.y), Math.max(2, b.r * scale), 0, Math.PI * 2);
      ctx.stroke();
    });
  }

  function drawMediumBlock(media, shift, opts) {
    opts = opts || {};
    const shx = (shift || 0) * 3.4;
    const shy = (shift || 0) * -1.1;
    const L = BOX.L + shx, R = BOX.R + shx, B = BOX.B + shy, T = BOX.T + shy;
    if (shift > 0.97 && !opts.force) return;
    const wall = media.kind === 'liquid' ? 0.16 : 0;
    ctx.save();
    // 外框
    ctx.beginPath();
    ctx.rect(tx(L), ty(T), tx(R) - tx(L), ty(B) - ty(T));
    if (media.kind === 'liquid') {
      ctx.fillStyle = 'rgba(200,220,240,0.10)';
      ctx.fill();
      const iL = L + wall, iR = R - wall, iB = B + wall, iT = T - 0.35;
      ctx.fillStyle = media.liquid || media.fill;
      ctx.fillRect(tx(iL), ty(iT), tx(iR) - tx(iL), ty(iB) - ty(iT));
      drawLiquidSurface(iL, iR, iT, 'rgba(255,255,255,0.55)');
      drawBubbles(iL, iR, iB, iT);
      // 薄壁
      ctx.strokeStyle = 'rgba(200,220,235,0.7)';
      ctx.lineWidth = Math.max(2.0, lw(2.4));
      ctx.strokeRect(tx(L), ty(T), tx(R) - tx(L), ty(B) - ty(T));
      ctx.strokeStyle = 'rgba(200,220,235,0.35)';
      ctx.lineWidth = Math.max(1.0, lw(1.1));
      ctx.strokeRect(tx(iL), ty(T - 0.02), tx(iR) - tx(iL), ty(iB) - ty(T - 0.02));
    } else if (media.kind === 'air') {
      ctx.fillStyle = 'rgba(180,200,230,0.05)';
      ctx.fill();
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = media.stroke;
      ctx.lineWidth = Math.max(1.6, lw(1.8));
      ctx.stroke();
      ctx.setLineDash([]);
    } else {
      ctx.fillStyle = media.fill;
      ctx.fill();
      ctx.strokeStyle = media.stroke;
      ctx.lineWidth = Math.max(2.2, lw(2.6));
      ctx.stroke();
      // 實心塊的輕微高光，與液體區分
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.beginPath();
      ctx.moveTo(tx(L), ty(T));
      ctx.lineTo(tx(L + 0.45), ty(T));
      ctx.lineTo(tx(L + 0.45), ty(B + 0.15));
      ctx.lineTo(tx(L), ty(B));
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    const nTxt = media.id === 'glass' ? 'n = 1.60' : (media.id === 'air' ? 'n ≈ 1.00' : 'n = ' + media.n);
    const label = (media.kind === 'liquid' ? media.name : (media.kind === 'air' ? '空氣（對照）' : media.name + '塊')) + '　' + nTxt;
    drawLabel(label, (L + R) / 2, B + 0.55, media.stroke || COL.acc, fs(16));
    if (media.kind === 'liquid') {
      drawLabel('液面', R + 0.55, T - 0.35, '#c8d6e8', fs(12), 'left');
    }
  }

  function drawLightBox(on, t) {
    t = t == null ? 1 : t;
    if (t <= 0) return;
    const dir = INC_DIR;
    const back = { x: -dir.x, y: -dir.y };
    const perp = { x: -dir.y, y: dir.x };
    const slit = P_START;
    const depth = 1.50, half = 0.58;
    const body = [
      add(slit, mul(perp, -half * 0.50)),
      add(slit, mul(perp, half * 0.50)),
      add(add(slit, mul(back, depth)), mul(perp, half)),
      add(add(slit, mul(back, depth)), mul(perp, -half))
    ];
    ctx.save();
    ctx.globalAlpha = t;
    ctx.fillStyle = '#2a2a32';
    ctx.beginPath();
    ctx.moveTo(tx(body[0].x), ty(body[0].y));
    body.forEach((pt, i) => { if (i) ctx.lineTo(tx(pt.x), ty(pt.y)); });
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#d0c8a8';
    ctx.lineWidth = Math.max(1.6, lw(1.8));
    ctx.stroke();
    // 前板狹縫
    const s1 = add(slit, mul(perp, 0.09));
    const s0 = add(slit, mul(perp, -0.09));
    const s2 = add(s0, mul(back, 0.12));
    const s3 = add(s1, mul(back, 0.12));
    ctx.fillStyle = on ? '#ffe27a' : '#111';
    ctx.beginPath();
    ctx.moveTo(tx(s0.x), ty(s0.y));
    ctx.lineTo(tx(s1.x), ty(s1.y));
    ctx.lineTo(tx(s3.x), ty(s3.y));
    ctx.lineTo(tx(s2.x), ty(s2.y));
    ctx.closePath();
    ctx.fill();
    if (on) {
      ctx.shadowColor = '#ffd84a';
      ctx.shadowBlur = 16;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    // 電線（向紙外左上方，避免穿過光線）
    const cord = add(add(slit, mul(back, depth)), mul(perp, -0.2));
    ctx.strokeStyle = '#8a8a90';
    ctx.lineWidth = Math.max(1.5, lw(1.6));
    ctx.beginPath();
    ctx.moveTo(tx(cord.x), ty(cord.y));
    ctx.lineTo(tx(cord.x - 0.7), ty(cord.y + 0.55));
    ctx.stroke();
    ctx.restore();
    // 標籤放在箱體左上方，避開箱身與入射線
    drawLabel('光線箱（單狹縫）', slit.x + 1.05, slit.y + 0.95, '#ffe27a', fs(14), 'left');
  }

  function drawProtractor(hit, t) {
    if (t < 0.2) return;
    const radW = 1.25;
    ctx.save();
    ctx.globalAlpha = 0.9 * Math.min(1, t);
    const rPx = radW * scale;
    const aN = pixAngAt(hit, { x: 1, y: 0 });
    const aDown = pixAngAt(hit, { x: 0, y: -1 });
    const aMid = pixAngAt(hit, { x: 1, y: -1 });
    function inCcw(a, b, p) {
      let db = b - a, dp = p - a;
      while (db < 0) db += Math.PI * 2;
      while (db >= Math.PI * 2) db -= Math.PI * 2;
      while (dp < 0) dp += Math.PI * 2;
      while (dp >= Math.PI * 2) dp -= Math.PI * 2;
      return dp <= db + 1e-6;
    }
    const ccw = inCcw(aN, aDown, aMid);
    ctx.strokeStyle = 'rgba(255,226,122,0.85)';
    ctx.fillStyle = 'rgba(255,226,122,0.07)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(tx(hit.x), ty(hit.y), rPx, aN, aDown, !ccw);
    ctx.stroke();
    for (let d = 0; d <= 90; d += 10) {
      const ang = rad(-d);
      const v = { x: Math.cos(ang), y: Math.sin(ang) };
      const inner = d % 30 === 0 ? 0.78 : 0.90;
      const p0 = add(hit, mul(v, radW * inner));
      const p1 = add(hit, mul(v, radW));
      ctx.beginPath();
      ctx.moveTo(tx(p0.x), ty(p0.y));
      ctx.lineTo(tx(p1.x), ty(p1.y));
      ctx.stroke();
    }
    ctx.restore();
    drawLabel('量角器', hit.x - 2.05, hit.y - 0.15, '#ffe27a', fs(13), 'right');
  }

  function drawUndeviated(g, t) {
    if (!state.showStraight) return;
    t = t == null ? 1 : t;
    if (t <= 0) return;
    drawDashed(P_IN.x, P_IN.y, g.undefEnd.x, g.undefEnd.y, COL.V, Math.max(1.5, lw(1.8)), t);
    if (t > 0.7) {
      drawLabel('未偏折', g.undefOut.x + 0.55, g.undefOut.y - 0.15, COL.V, fs(13), 'left');
    }
  }

  function drawFullRays(g, media, opts) {
    opts = opts || {};
    const tInc = opts.tInc == null ? 1 : opts.tInc;
    const tRef = opts.tRef == null ? 1 : opts.tRef;
    const tEx = opts.tEx == null ? 1 : opts.tEx;
    const glow = !!opts.glow;
    const withArrow = opts.withArrow !== false;
    const alpha = opts.alpha == null ? 1 : opts.alpha;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (glow) {
      ctx.shadowColor = COL.I;
      ctx.shadowBlur = 14;
    }
    drawSolidRay(P_START.x, P_START.y, P_IN.x, P_IN.y, COL.I, Math.max(2.4, lw(2.8)), withArrow, tInc);
    if (glow) ctx.shadowColor = COL.R;
    drawSolidRay(P_IN.x, P_IN.y, g.pOut.x, g.pOut.y, COL.R, Math.max(2.4, lw(2.8)), withArrow, tRef);
    if (glow) ctx.shadowColor = COL.E;
    drawSolidRay(g.pOut.x, g.pOut.y, g.pEnd.x, g.pEnd.y, COL.E, Math.max(2.4, lw(2.8)), withArrow, tEx);
    ctx.restore();
  }

  function drawGhostRay(n, color, label, alpha, labelYOff) {
    const g = geomFor(n);
    ctx.save();
    ctx.globalAlpha = alpha == null ? 0.62 : alpha;
    drawDashed(P_IN.x, P_IN.y, g.pOut.x, g.pOut.y, color, Math.max(1.8, lw(2.0)), 1);
    drawDashed(g.pOut.x, g.pOut.y, g.pEnd.x, g.pEnd.y, color, Math.max(1.8, lw(2.0)), 1);
    ctx.restore();
    if (label) {
      const lp = { x: g.pEnd.x + 0.15, y: g.pEnd.y + (labelYOff || 0) };
      drawLabel(label, lp.x, lp.y, color, fs(13), 'left');
    }
  }

  function drawIncidentLabels(t) {
    if (!state.showAngles || t < 0.5) return;
    // 入射角弧：空氣一側，法線向左 與 入射方向的反向（指向光源）
    const nAir = { x: -1, y: 0 };
    const toSource = { x: -INC_DIR.x, y: -INC_DIR.y };
    drawAngleArc(P_IN, nAir, toSource, Math.max(26, 32 * scale / 28), COL.I, 'i = 60°', null, t);
  }

  function drawRefractLabels(g, media, t) {
    if (!state.showAngles || t < 0.5) return;
    const nMed = { x: 1, y: 0 };
    drawAngleArc(P_IN, nMed, g.refDir, Math.max(36, 44 * scale / 28), COL.R, 'r ' + media.rShort, null, t);
  }

  function drawExitLabels(g, t) {
    if (!state.showAngles || t < 0.5) return;
    const nAir = { x: 1, y: 0 }; // 出射點空氣在右側
    drawAngleArc(g.pOut, nAir, INC_DIR, Math.max(24, 28 * scale / 28), COL.I, 'e = 60°', null, t);
    if (t > 0.75) {
      drawLabel('出射線 ∥ 入射線', g.pEnd.x + 0.15, g.pEnd.y + 0.55, '#ffe27a', fs(13), 'left');
    }
  }

  function drawRayCaptions(g, tInc, tRef, tEx) {
    if (tInc > 0.6) drawLabel('入射線', lerp(P_START, P_IN, 0.45).x - 0.15, lerp(P_START, P_IN, 0.45).y + 0.42, COL.I, fs(14), 'right');
    if (tRef > 0.6) drawLabel('折射線', lerp(P_IN, g.pOut, 0.55).x + 0.55, lerp(P_IN, g.pOut, 0.55).y + 0.15, COL.R, fs(14), 'left');
    if (tEx > 0.6) drawLabel('出射線', lerp(g.pOut, g.pEnd, 0.62).x + 0.2, lerp(g.pOut, g.pEnd, 0.62).y + 0.42, COL.I, fs(14), 'left');
  }

  function drawEntryExitNormals(g, tIn, tOut) {
    const nAir = { x: -1, y: 0 };
    drawNormalAt(P_IN, nAir, 2.15, tIn, true, { x: 0, y: 1 });
    if (tOut > 0) drawNormalAt(g.pOut, { x: 1, y: 0 }, 1.7, tOut, tOut > 0.7, { x: 0, y: 1 });
  }

  function drawCanvasTable(rows, px, py, colW, rowH, title, highlightRow) {
    const cols = rows[0].length;
    const w = colW * cols;
    const h = rowH * rows.length;
    ctx.save();
    ctx.fillStyle = 'rgba(10,18,36,0.88)';
    roundRect(ctx, px, py, w, h + (title ? 36 : 0), 10);
    ctx.fill();
    ctx.strokeStyle = '#ffffff33';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    let y = py;
    if (title) {
      drawLabelPx(title, px + w / 2, py + 20, '#7fdcff', Math.max(18, Math.min(26, W / 55)));
      y = py + 36;
    }
    const fsz = Math.max(15, Math.min(22, W / 70));
    rows.forEach((row, ri) => {
      const ry = y + ri * rowH;
      if (ri === 0) {
        ctx.fillStyle = '#1f3a66';
        ctx.fillRect(px, ry, w, rowH);
      } else if (ri === highlightRow) {
        ctx.fillStyle = 'rgba(224,164,0,0.28)';
        ctx.fillRect(px, ry, w, rowH);
      } else if (ri % 2 === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        ctx.fillRect(px, ry, w, rowH);
      }
      row.forEach((cell, ci) => {
        const cx = px + ci * colW + colW / 2;
        const color = ri === 0 ? '#ffe27a' : (ci === 0 ? '#7fdcff' : '#f4f7fb');
        drawLabelPx(cell, cx, ry + rowH / 2, color, fsz);
      });
    });
    // 格線
    ctx.strokeStyle = '#ffffff22';
    ctx.lineWidth = 1;
    for (let c = 1; c < cols; c++) {
      ctx.beginPath();
      ctx.moveTo(px + c * colW, y);
      ctx.lineTo(px + c * colW, y + rowH * rows.length);
      ctx.stroke();
    }
    ctx.restore();
    return h + (title ? 36 : 0);
  }


  function worldForDiagram(rightFrac) {
    // 紙張與光線箱範圍
    const view = rightFrac ? { x: 0, y: 0, w: 1 - rightFrac, h: 1 } : null;
    setWorld(-5.6, 11.6, -2.4, 16.6, 0.06, view);
  }

  function commonBase(opts) {
    opts = opts || {};
    const media = currentMedia();
    const g = geomFor(media.n);
    const p = state.progress;
    const dark = state.darkLab;
    drawBackground(dark);
    worldForDiagram(opts.rightFrac);
    drawPaper();
    if (opts.outline || opts.outlineT) {
      drawOutline(opts.outlineT == null ? 1 : opts.outlineT);
    }
    if (opts.box !== false) {
      const sh = opts.shift == null ? state.boxShift : opts.shift;
      if (sh < 0.98) drawMediumBlock(media, sh);
    }
    if (opts.lightBox !== false) {
      drawLightBox(!!opts.beamOn, opts.lightT == null ? 1 : opts.lightT);
    }
    return { media, g, p, dark };
  }

      ctx.globalAlpha = 0.95;
      ctx.lineWidth = Math.max(2.4, lw(2.6));

      ctx.stroke();

  function tick(ts) {
    const steps = currentSteps();
    const anim = steps[state.step].anim;
    if (state.animating && anim !== 'none') {
      if (state.lastTs == null) state.lastTs = ts;
      const dt = ts - state.lastTs;
      state.lastTs = ts;
      const dur = (anim === 'dark' || anim === 'remove' || anim === 'measure' || anim === 'compare' || anim === 'table') ? 1500
        : (anim === 'enter' || anim === 'beam' || anim === 'slider') ? 1400
        : GROW_MS;
      state.progress = Math.min(1, state.progress + dt / dur);
      if (anim === 'dark') state.darkLab = state.progress;
      if (anim === 'remove') state.boxShift = state.progress;
      if (state.progress >= 1) {
        state.animating = false;
        state.progress = 1;
        finishAnimExtras();
        if (state.autoplay) holdUntil = ts + AUTO_HOLD_MS;
        updateUI();
      }
    } else if (state.autoplay && state.progress >= 1) {
      if (!holdUntil) holdUntil = ts + AUTO_HOLD_MS;
      if (ts >= holdUntil) {
        holdUntil = 0;
        if (state.step >= steps.length - 1) {
          state.autoplay = false;
          updateUI();
        } else {
          goStep(state.step + 1, true);
        }
      }
    }
    drawFrame();
    requestAnimationFrame(tick);
  }

  window.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); state.autoplay = false; nextStep(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prevStep(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); toggleAuto(); }
    else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); replay(); }
    else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); document.getElementById('btnFull').click(); }
    else if (e.key >= '1' && e.key <= '3') { e.preventDefault(); goScene(+e.key - 1, false); }
  });

  window.addEventListener('resize', () => { resize(); });

  function applyHash() {
    const h = (location.hash || '').replace('#', '').toUpperCase();
    const m = h.match(/^([ABC])(\d+)?$/);
    if (!m) return;
    const si = 'ABC'.indexOf(m[1]);
    goScene(si, false);
    if (m[2] != null) goStep(Math.min(+m[2], currentSteps().length - 1), false);
  }
  window.addEventListener('hashchange', applyHash);

  rebuildSteps();
  rebuildMediaBtns();
  resize();
  updateUI();
  applyHash();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
