<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吞噬作用 — 物質穿越細胞膜</title>
<style>
  :root {
    --bg: #f7f9fc;
    --panel: #ffffff;
    --ink: #1a2332;
    --muted: #5a6a7a;
    --accent: #2c5aa0;
    --accent-soft: #e8f0fa;
    --border: #d0dae6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC",
                 "Heiti TC", "Source Han Sans TC", sans-serif;
  }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  header .sub { font-size: 0.9rem; color: var(--muted); }
  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 16px;
    padding: 16px 24px 12px;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
  }
  @media (max-width: 960px) { .main { grid-template-columns: 1fr; } }
  .stage-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 2px 8px rgba(26,35,50,0.06);
  }
  .canvas-box {
    position: relative;
    background: linear-gradient(180deg, #eef4fb 0%, #f8fafc 45%, #eef4fb 100%);
    aspect-ratio: 16 / 10;
    min-height: 420px;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .legend-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 14px 20px;
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    background: #fafcfe;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .swatch {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.12); flex-shrink: 0;
  }
  .side { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(26,35,50,0.06);
  }
  .card h2 { font-size: 0.95rem; color: var(--accent); margin-bottom: 8px; }
  .scene-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; line-height: 1.35; }
  .scene-desc { font-size: 0.92rem; line-height: 1.55; color: var(--ink); }
  .scene-desc strong { color: var(--accent); }
  .phase-list { display: flex; flex-direction: column; gap: 5px; }
  .phase-item {
    font-size: 0.84rem;
    padding: 6px 10px;
    border-radius: 7px;
    border: 1px solid transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .phase-item:hover { background: var(--accent-soft); color: var(--ink); }
  .phase-item.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
  }
  .phase-item .num { opacity: 0.65; margin-right: 4px; font-variant-numeric: tabular-nums; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    border: none; border-radius: 8px; padding: 8px 14px; font: inherit;
    font-size: 0.88rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.secondary { background: #eef2f7; color: var(--ink); }
  .btn.secondary:hover { background: #e0e8f0; }
  .hint { font-size: 0.78rem; color: var(--muted); line-height: 1.45; margin-top: 10px; }
  .progress-wrap {
    margin-top: 10px;
    height: 8px;
    background: #e8eef5;
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 4px;
  }
  footer {
    text-align: center; padding: 8px 16px 14px;
    font-size: 0.75rem; color: var(--muted);
  }
  kbd {
    display: inline-block; padding: 1px 6px; border: 1px solid var(--border);
    border-radius: 4px; background: #fff;
    font-family: ui-monospace, monospace; font-size: 0.85em;
  }
  a.back-link {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.92rem;
    white-space: nowrap;
    margin-right: 4px;
  }
  a.back-link:hover { text-decoration: underline; }

  html, body { overflow-x: hidden; max-width: 100%; }
  .main, .stage-wrap, .side, .card, header, footer, .canvas-box {
    min-width: 0;
    max-width: 100%;
  }
  .canvas-box { width: 100%; }
  canvas { max-width: 100%; }

  @media (max-width: 1100px) {
    .canvas-box { min-height: 0; }
  }

  @media (max-width: 900px) {
    header { padding: 10px 12px; gap: 8px 12px; }
    header h1 { font-size: 1.15rem; }
    header .sub { font-size: 0.82rem; }
    .main {
      grid-template-columns: 1fr;
      padding: 10px 12px 8px;
      gap: 12px;
    }
    .canvas-box {
      min-height: 0;
      width: min(100%, calc(62vh * 1.6));
      max-height: 62vh;
      margin-inline: auto;
    }
    canvas { width: 100%; height: 100%; max-width: 100%; }
    .legend-bar { padding: 8px 10px; gap: 8px 12px; }
    .card { padding: 12px; }
    .steps { max-height: none; }
    .step-btn, .btn, .toggle-btn, .phase-item { min-height: 44px; }
    .controls { gap: 8px; }
    .btn { flex: 1 1 calc(50% - 8px); }
    .toggle-group { flex-wrap: wrap; }
    .toggle-btn { flex: 1 1 calc(50% - 6px); min-width: 0; }
    a.back-link { white-space: normal; }
    footer { padding: 8px 12px 16px; overflow-wrap: anywhere; }
  }
</style>
</head>
<body>
<header>
  <a class="back-link" href="f4-l4-membrane.html">← 返回課次目錄</a>
  <h1>吞噬作用</h1>
  <span class="sub">物質穿越細胞膜 · 香港中學文憑試生物學 · 中四</span>
</header>

<div class="main">
  <div class="stage-wrap">
    <div class="canvas-box">
      <canvas id="cv" width="1280" height="800" aria-label="吞噬作用連續動畫"></canvas>
    </div>
    <div class="legend-bar">
      <span class="legend-item"><span class="swatch" style="background:#e8c96a"></span>細胞質</span>
      <span class="legend-item"><span class="swatch" style="background:#2a9d9f;border-radius:4px;width:22px;height:8px"></span>細胞膜</span>
      <span class="legend-item"><span class="swatch" style="background:#5dade2;border-radius:4px;width:22px;height:10px"></span>偽足</span>
      <span class="legend-item"><span class="swatch" style="background:#c0392b"></span>外來粒子</span>
      <span class="legend-item"><span class="swatch" style="background:#2a9d9f"></span>吞噬泡</span>
      <span class="legend-item"><span class="swatch" style="background:#5b7a3a"></span>溶酶體</span>
      <span class="legend-item"><span class="swatch" style="background:#6c3483"></span>細胞核</span>
    </div>
  </div>

  <aside class="side">
    <div class="card">
      <div class="scene-title" id="phaseTitle">察覺外來粒子</div>
      <p class="scene-desc" id="phaseDesc"></p>
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    </div>
    <div class="card">
      <h2>連續過程（同一動畫）</h2>
      <div class="phase-list" id="phaseList"></div>
    </div>
    <div class="card">
      <h2>播放控制</h2>
      <div class="controls">
        <button class="btn" id="btnPlay" type="button">暫停</button>
        <button class="btn secondary" id="btnRestart" type="button">重播</button>
      </div>
      <p class="hint">
        鍵盤：<kbd>空白鍵</kbd> 暫停／播放 · <kbd>←</kbd><kbd>→</kbd> 上／下一步 · <kbd>R</kbd> 重播<br>
        點選步驟可跳到<strong>同一連續動畫</strong>的該時段。<br>
        流程對應：察覺 → 偽足包圍 → 膜掐斷成吞噬泡 → 進入內部 → 酶分解。
      </p>
    </div>
  </aside>
</div>

<footer>
  原創教學動畫 · 概念對應 DSE 生物「吞噬作用」· 請離線以 Chrome 開啟
</footer>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("cv");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  // Continuous clip: notice → reach → surround → vesicle → digest
  const DURATION = 18;

  const phases = [
    {
      t0: 0, t1: 3.2,
      title: "1. 察覺外來粒子",
      desc: "吞噬細胞（如白血球）發現<strong>不屬於體內</strong>的外來粒子。細胞膜開始<strong>朝粒子方向緩緩隆起</strong>——與下一步連續過渡，沒有突然跳轉。"
    },
    {
      t0: 3.2, t1: 7.5,
      title: "2. 伸出兩條偽足",
      desc: "同一段動畫中，細胞膜向上、下長成<strong>兩條平滑彎曲的偽足</strong>，逐漸<strong>包圍</strong>外來粒子。膜緣全程圓滑，沒有尖角。"
    },
    {
      t0: 7.5, t1: 10.5,
      title: "3. 包圍並吞入",
      desc: "兩條偽足<strong>合攏</strong>，細胞膜把外來粒子<strong>完全包圍</strong>。接著膜在合攏處<strong>掐斷</strong>，粒子連同一圈膜一起進入細胞。"
    },
    {
      t0: 10.5, t1: 14.0,
      title: "4. 形成吞噬泡並進入內部",
      desc: "包圍粒子的那圈膜成為獨立的<strong>圓形吞噬泡</strong>，清楚可見地<strong>移入細胞質</strong>。外層細胞膜重新封合。"
    },
    {
      t0: 14.0, t1: 18.0,
      title: "5. 溶酶體融合／酶分解",
      desc: "<strong>溶酶體</strong>移向吞噬泡並融合，釋放<strong>消化酶</strong>，把外來粒子<strong>分解、中和</strong>。產物可被細胞利用。"
    }
  ];

  let playing = true;
  let clock0 = performance.now();
  let animT = 0;

  const titleEl = document.getElementById("phaseTitle");
  const descEl = document.getElementById("phaseDesc");
  const btnPlay = document.getElementById("btnPlay");
  const progressBar = document.getElementById("progressBar");
  const phaseList = document.getElementById("phaseList");

  phases.forEach((p, i) => {
    const el = document.createElement("div");
    el.className = "phase-item" + (i === 0 ? " active" : "");
    el.innerHTML = '<span class="num"></span>' + p.title;
    el.addEventListener("click", () => seekTo(p.t0 + 0.08));
    phaseList.appendChild(el);
  });

  function smoothstep(a, b, x) {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }

  function updateUI() {
    let idx = 0;
    for (let i = 0; i < phases.length; i++) {
      if (animT >= phases[i].t0) idx = i;
    }
    const p = phases[idx];
    titleEl.textContent = p.title;
    descEl.innerHTML = p.desc;
    [...phaseList.children].forEach((el, i) => el.classList.toggle("active", i === idx));
    btnPlay.textContent = playing ? "暫停" : "播放";
    progressBar.style.width = (Math.min(1, animT / DURATION) * 100).toFixed(1) + "%";
  }

  function seekTo(t) {
    animT = Math.max(0, Math.min(DURATION - 0.02, t));
    clock0 = performance.now() - animT * 1000;
    updateUI();
  }
  function restart() {
    animT = 0;
    clock0 = performance.now();
    updateUI();
  }
  function currentPhaseIndex() {
    let idx = 0;
    for (let i = 0; i < phases.length; i++) {
      if (animT >= phases[i].t0) idx = i;
    }
    return idx;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCallout(x, y, text, color) {
    ctx.font = "bold 24px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
    const tw = ctx.measureText(text).width;
    const pad = 12;
    roundRect(x - tw / 2 - pad, y - 15, tw + pad * 2, 30, 8);
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.8;
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, x, y);
    ctx.textBaseline = "alphabetic";
  }

  /** Red pill-shaped food particle (Britannica-style). */
  function drawParticle(x, y, r, label, broken) {
    const spoil = broken || 0;
    const rw = r * 1.25 * (1 - spoil * 0.45);
    const rh = r * 0.72 * (1 - spoil * 0.5);
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.ellipse(0, 0, rw, rh, 0, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(-rw * 0.25, -rh * 0.3, 2, 0, 0, rw);
    if (spoil > 0.35) {
      g.addColorStop(0, "rgba(250,220,220,0.85)");
      g.addColorStop(0.5, "rgba(230,160,160,0.7)");
      g.addColorStop(1, "rgba(200,120,120,0.45)");
      ctx.globalAlpha = 1 - spoil * 0.55;
    } else {
      g.addColorStop(0, "#ff8a7a");
      g.addColorStop(0.45, "#e74c3c");
      g.addColorStop(1, "#c0392b");
    }
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = spoil > 0.35 ? "rgba(160,80,80,0.35)" : "rgba(100,20,20,0.35)";
    ctx.lineWidth = 1.6;
    ctx.stroke();
    // tiny surface bristles (subtle)
    if (spoil < 0.4) {
      ctx.strokeStyle = "rgba(255,255,255,0.45)";
      ctx.lineWidth = 1.2;
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2;
        const x0 = Math.cos(a) * rw * 0.92;
        const y0 = Math.sin(a) * rh * 0.92;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x0 + Math.cos(a) * 5, y0 + Math.sin(a) * 5);
        ctx.stroke();
      }
    }
    ctx.restore();
    if (label) {
      ctx.fillStyle = "#1a2332";
      ctx.font = "bold 20px 'Noto Sans TC', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(label, x, y - rh - 14);
    }
  }

  /** Kidney-bean purple nucleus (smooth polar notch, no sharp corners). */
  function drawNucleus(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-0.18);
    const g = ctx.createRadialGradient(-12, -8, 4, 0, 0, 52);
    g.addColorStop(0, "#9b59b6");
    g.addColorStop(1, "#5b2c6f");
    ctx.beginPath();
    const N = 64;
    for (let i = 0; i <= N; i++) {
      const a = (i / N) * Math.PI * 2;
      let px = Math.cos(a) * 52;
      let py = Math.sin(a) * 40;
      // smooth kidney notch on the right
      const notch = Math.exp(-Math.pow(a / 0.55, 2));
      px -= notch * 24;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = "#4a235a";
    ctx.lineWidth = 2.2;
    ctx.lineJoin = "round";
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px 'Noto Sans TC', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("細胞核", -6, 1);
    ctx.textBaseline = "alphabetic";
    ctx.restore();
  }

  function drawLysosome(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(x - 2, y - 2, 1, x, y, r);
    g.addColorStop(0, "#a8c070");
    g.addColorStop(1, "#5b7a3a");
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = "#3d5228";
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }

  function drawAttentionRays(cx, cy, px, py, amt) {
    if (amt <= 0) return;
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(animT * 5);
    ctx.strokeStyle = "#f39c12";
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 8]);
    ctx.beginPath();
    ctx.moveTo(cx + 180, cy);
    ctx.lineTo(px - 50, py);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = amt;
    for (let i = 0; i < 2; i++) {
      const rr = 48 + i * 16 + (animT * 40) % 20;
      ctx.beginPath();
      ctx.arc(px, py, rr, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(243,156,18," + (0.45 - i * 0.15) + ")";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
  }

  /**
   * Single closed smooth blob via polar radius + angular blur.
   * Two wide raised-cosine lobes = 偽足; NO mouth carve, NO arm polylines.
   * Heavy blur on r(θ) guarantees no visible corners when paused.
   */
  function buildCell(cx, cy, rx, ry, reach, surround, settle, noticeAmt, partX, partY, partR) {
    const wobT = animT * 1.05;
    const R = Math.max(reach, noticeAmt * 0.3);
    const S = surround;

    // Peak angles: start spread (wide U), close together as surround → fuse
    const peakSpread = lerp(0.95, 0.14, S);
    const uPeak = -peakSpread;
    const lPeak = peakSpread;

    // Wide lobes → soft roots & round tips (narrow = pointy / V crotch)
    const lobeHalf = lerp(1.15, 0.72, S);

    // How far lobes push past the base ellipse toward the particle
    const distPart = Math.hypot(partX - cx, partY - cy);
    // Target tip past the particle so the C pocket cradles it (Britannica reach)
    const reachPx = Math.max(0, distPart + partR * lerp(1.25, 0.25, S) - rx * 0.42);
    // Shrink lobe amp as surround closes so fused silhouette doesn't stay spiked
    const lobeAmp = R * (1 - settle * 0.9) * lerp(1, 0.28, S)
      * lerp(reachPx * 0.85, reachPx * 1.12, smoothstep(0.08, 0.75, R));

    function angDist(a, b) {
      let d = a - b;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      return d;
    }

    // Raised-cosine bump, C1 at skirts; power < 1 flattens peak (rounder tip)
    function lobeEnv(d, half) {
      const ad = Math.abs(d);
      if (ad >= half || half < 1e-6) return 0;
      const u = ad / half;
      const cos = 0.5 * (1 + Math.cos(u * Math.PI));
      return Math.pow(cos, 0.85);
    }

    function ellipseR(theta) {
      const c = Math.cos(theta), s = Math.sin(theta);
      return (rx * ry) / Math.sqrt((ry * c) * (ry * c) + (rx * s) * (rx * s));
    }

    const N = 256;
    const radii = new Array(N);
    for (let i = 0; i < N; i++) {
      const theta = -Math.PI + (i / N) * Math.PI * 2;
      let r = ellipseR(theta);
      r *= 1
        + 0.02 * Math.sin(theta * 3 + wobT)
        + 0.012 * Math.sin(theta * 5 - wobT * 0.7)
        + 0.008 * Math.sin(theta * 2 + 0.9);

      if (R > 0.01) {
        r += lobeAmp * lobeEnv(angDist(theta, uPeak), lobeHalf);
        r += lobeAmp * lobeEnv(angDist(theta, lPeak), lobeHalf);
      }

      // Soft notice bulge on particle-facing side (before arms dominate)
      if (noticeAmt > 0.02 && reach < 0.5) {
        const facing = Math.max(0, Math.cos(theta));
        r += noticeAmt * (1 - smoothstep(0.12, 0.55, reach)) * facing * facing * 28;
      }

      if (settle > 0.01) {
        const base = ellipseR(theta) * (1 + 0.018 * Math.sin(theta * 3 + wobT));
        r = lerp(r, base, settle);
      }
      radii[i] = Math.max(r, rx * 0.32);
    }

    // Angular blur — the actual corner-killer (circular convolution on r)
    const blurPasses = (R > 0.2 && S < 0.45) ? 10 : (R > 0.15 ? 6 : 3);
    for (let p = 0; p < blurPasses; p++) {
      const copy = radii.slice();
      for (let i = 0; i < N; i++) {
        const a = copy[(i - 1 + N) % N];
        const b = copy[i];
        const c = copy[(i + 1) % N];
        // 5-tap for stronger low-pass
        const d = copy[(i - 2 + N) % N];
        const e = copy[(i + 2) % N];
        radii[i] = 0.1 * d + 0.2 * a + 0.4 * b + 0.2 * c + 0.1 * e;
      }
    }

    let pts = [];
    for (let i = 0; i < N; i++) {
      const theta = -Math.PI + (i / N) * Math.PI * 2;
      const r = radii[i];
      pts.push([cx + Math.cos(theta) * r, cy + Math.sin(theta) * r]);
    }

    // Light Cartesian refine (keeps shape, softens any residual)
    function smoothRing(input, passes) {
      let cur = input;
      for (let p = 0; p < passes; p++) {
        const out = [];
        const n = cur.length;
        for (let i = 0; i < n; i++) {
          const a = cur[(i - 1 + n) % n];
          const b = cur[i];
          const c = cur[(i + 1) % n];
          out.push([(a[0] + 2 * b[0] + c[0]) / 4, (a[1] + 2 * b[1] + c[1]) / 4]);
        }
        cur = out;
      }
      return cur;
    }
    pts = smoothRing(pts, R > 0.2 ? 5 : 2);

    let upLbl = null, loLbl = null;
    const showArms = R > 0.32 && settle < 0.35 && S < 0.85;
    if (showArms) {
      // Label near lobe peaks on the silhouette
      const iu = Math.round(((uPeak + Math.PI) / (Math.PI * 2)) * N + N) % N;
      const il = Math.round(((lPeak + Math.PI) / (Math.PI * 2)) * N + N) % N;
      upLbl = [pts[iu][0], pts[iu][1] - 26];
      loLbl = [pts[il][0], pts[il][1] + 32];
    }
    return { pts: pts, upLbl: upLbl, loLbl: loLbl };
  }

  /** Fill + stroke closed ring with Catmull–Rom cubics; teal membrane, gold cytoplasm. */
  function fillCell(pts, cx, cy) {
    const n = pts.length;
    if (n < 4) return;

    function crBezier(p0, p1, p2, p3) {
      return {
        cp1x: p1[0] + (p2[0] - p0[0]) / 6,
        cp1y: p1[1] + (p2[1] - p0[1]) / 6,
        cp2x: p2[0] - (p3[0] - p1[0]) / 6,
        cp2y: p2[1] - (p3[1] - p1[1]) / 6
      };
    }

    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n];
      const p1 = pts[i];
      const p2 = pts[(i + 1) % n];
      const p3 = pts[(i + 2) % n];
      const b = crBezier(p0, p1, p2, p3);
      ctx.bezierCurveTo(b.cp1x, b.cp1y, b.cp2x, b.cp2y, p2[0], p2[1]);
    }
    ctx.closePath();

    // Britannica-like yellowish cytoplasm
    const g = ctx.createRadialGradient(cx - 40, cy - 35, 30, cx, cy, 300);
    g.addColorStop(0, "#f3e7b0");
    g.addColorStop(0.4, "#e8c96a");
    g.addColorStop(0.75, "#d4b04e");
    g.addColorStop(1, "#c4a040");
    ctx.fillStyle = g;
    ctx.fill();

    // Light grain hint
    ctx.save();
    ctx.clip();
    ctx.globalAlpha = 0.08;
    for (let i = 0; i < 80; i++) {
      const gx = cx + (Math.sin(i * 12.9898 + 1.1) * 0.5 + Math.cos(i * 78.233) * 0.5) * 200;
      const gy = cy + (Math.sin(i * 43.112 + 2.3) * 0.5 + Math.cos(i * 17.77) * 0.5) * 170;
      ctx.beginPath();
      ctx.arc(gx, gy, 1.6, 0, Math.PI * 2);
      ctx.fillStyle = "#8a7020";
      ctx.fill();
    }
    ctx.restore();

    // Teal plasma membrane — thick, round joins
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n];
      const p1 = pts[i];
      const p2 = pts[(i + 1) % n];
      const p3 = pts[(i + 2) % n];
      const b = crBezier(p0, p1, p2, p3);
      ctx.bezierCurveTo(b.cp1x, b.cp1y, b.cp2x, b.cp2y, p2[0], p2[1]);
    }
    ctx.closePath();
    ctx.strokeStyle = "#1f8a8c";
    ctx.lineWidth = 7;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.stroke();
    // soft outer halo (thin — thick double-stroke looked faceted)
    ctx.strokeStyle = "rgba(42,157,159,0.28)";
    ctx.lineWidth = 9;
    ctx.stroke();
  }

  function drawVesicle(x, y, r, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    // filled interior so the circle reads as a distinct bubble
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(x - r * 0.25, y - r * 0.25, 4, x, y, r);
    g.addColorStop(0, "rgba(200,240,235,0.55)");
    g.addColorStop(0.55, "rgba(42,157,159,0.22)");
    g.addColorStop(1, "rgba(31,138,140,0.12)");
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = "#1f8a8c";
    ctx.lineWidth = 5;
    ctx.lineJoin = "round";
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, y, Math.max(4, r - 6), 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(31,138,140,0.4)";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  /** Partial → full ring around particle (= membrane wrapping / pinch-off). */
  function drawWrapRing(x, y, r, closeAmt, alpha) {
    // closeAmt 0 = open C facing left (into cell), 1 = full circle pinched off
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = "#1f8a8c";
    ctx.lineWidth = 5.5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const gap = (1 - closeAmt) * Math.PI * 0.95; // radians still open
    const start = gap * 0.5;
    const end = Math.PI * 2 - gap * 0.5;
    ctx.beginPath();
    if (closeAmt >= 0.98) {
      ctx.arc(x, y, r, 0, Math.PI * 2);
    } else {
      // open toward cell center (left) so wrap reads as arms closing from the right
      ctx.arc(x, y, r, start - Math.PI * 0.05, end - Math.PI * 0.05);
    }
    ctx.stroke();
    if (closeAmt > 0.55) {
      ctx.globalAlpha = alpha * (closeAmt - 0.55) / 0.45;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(42,157,159,0.14)";
      ctx.fill();
    }
    ctx.restore();
  }

  function drawInwardArrow(x0, y0, x1, y1, amt) {
    if (amt < 0.08) return;
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.45 * Math.min(1, amt);
    ctx.strokeStyle = "#1f8a8c";
    ctx.fillStyle = "#1f8a8c";
    ctx.lineWidth = 3;
    ctx.setLineDash([7, 6]);
    ctx.beginPath();
    ctx.moveTo(x0, y0 - 55);
    ctx.lineTo(x1, y1 - 55);
    ctx.stroke();
    ctx.setLineDash([]);
    // arrow head
    const ang = Math.atan2(0, x1 - x0);
    const ax = x1, ay = y1 - 55;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax + 12, ay - 7);
    ctx.lineTo(ax + 12, ay + 7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Resting lysosome positions (cytoplasm)
  const lysoHome = [
    [-90, -100], [-40, 110], [30, -130], [-130, 40],
    [50, 100], [-20, -40], [70, -60]
  ];

  function drawFrame() {
    const t = animT;

    // Timeline: notice → reach → surround → pinch-off circle → slide inward → digest
    const notice = smoothstep(0.5, 2.0, t) * (1 - smoothstep(3.2, 5.0, t));
    const reach = smoothstep(2.2, 6.5, t) * (1 - smoothstep(10.0, 12.2, t));
    const surround = smoothstep(6.0, 9.4, t);             // arms wrap particle
    const pinch = smoothstep(8.8, 10.6, t);               // tips fuse; wrap ring closes
    const vacForm = smoothstep(10.2, 11.4, t);            // distinct circular 吞噬泡
    const vacIn = smoothstep(11.0, 13.2, t);              // circle slides into interior
    const settle = smoothstep(10.4, 13.0, t);             // outer membrane reseals
    const enzyme = smoothstep(14.0, 16.0, t);
    const digest = smoothstep(15.2, 17.8, t);
    // legacy alias used only if needed
    const vesicle = Math.max(vacForm, vacIn);

    ctx.clearRect(0, 0, W, H);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#eaf2fa");
    bg.addColorStop(0.55, "#f7fafc");
    bg.addColorStop(1, "#e8f5ee");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#5a6a7a";
    ctx.font = "20px 'Noto Sans TC', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("細胞外", W - 130, 42);
    ctx.fillStyle = "#2c5aa0";
    ctx.font = "bold 20px 'Noto Sans TC', sans-serif";
    ctx.fillText("吞噬細胞（一個完整細胞）", 32, H - 32);

    const cx = 500, cy = 400, rx = 220, ry = 195;
    const partR = 38;

    // Pocket at the right edge where arms enclose the particle
    const approach = smoothstep(2.5, 9.2, t);
    const edgeX = lerp(960, cx + rx * 0.42 + 78, approach);
    const edgeY = cy;
    // Deep interior target for the phagosome
    const inX = cx + 55;
    const inY = cy;

    // Vacuole / particle center: stay at edge through pinch, then slide in
    const vacX = lerp(edgeX, inX, vacIn);
    const vacY = lerp(edgeY, inY, vacIn);
    const partX = vacForm > 0.15 ? vacX : edgeX;
    const partY = vacForm > 0.15 ? vacY : edgeY;

    if (notice > 0.05) drawAttentionRays(cx, cy, edgeX, edgeY, notice);

    // Cell silhouette still aims lobes at the *edge* pocket (not the inward vacuole)
    const cell = buildCell(cx, cy, rx, ry, reach, surround, settle, notice, edgeX, edgeY, partR);
    fillCell(cell.pts, cx, cy);

    // Clip organelles inside cell
    ctx.save();
    {
      const pts = cell.pts;
      const n = pts.length;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 0; i < n; i++) {
        const p0 = pts[(i - 1 + n) % n];
        const p1 = pts[i];
        const p2 = pts[(i + 1) % n];
        const p3 = pts[(i + 2) % n];
        const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
        const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
        const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
        const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2[0], p2[1]);
      }
      ctx.closePath();
      ctx.clip();
    }

    drawNucleus(cx - 80, cy + 8);

    if (t < 6) {
      ctx.fillStyle = "rgba(90,90,40,0.55)";
      ctx.font = "16px 'Noto Sans TC', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("細胞質", cx - 20, cy + 70);
    }

    // Lysosomes migrate toward the *moving* vacuole
    lysoHome.forEach((h, i) => {
      const homeX = cx + h[0], homeY = cy + h[1];
      const ang = i * 0.95;
      const fuseR = partR + 24;
      const tx = vacX + Math.cos(ang) * fuseR;
      const ty = vacY + Math.sin(ang) * fuseR;
      const migrate = enzyme;
      const ex = lerp(homeX, tx, migrate);
      const ey = lerp(homeY, ty, migrate);
      const rr = lerp(11, 5, migrate * digest);
      if (digest < 0.92) drawLysosome(ex, ey, rr);
    });

    // Vacuole + particle drawn INSIDE clip once pinched off (reads as interior)
    if (vacForm > 0.2) {
      const vr = lerp(partR + 14, partR + 30, Math.min(1, vacForm + vacIn * 0.35));
      drawVesicle(vacX, vacY, vr, Math.min(1, vacForm * 1.4));
      drawParticle(vacX, vacY, partR * lerp(1, 0.5, digest), null, digest);
    }

    ctx.restore(); // end cell clip

    if (cell.upLbl) drawCallout(cell.upLbl[0], cell.upLbl[1], "偽足", "#1a5276");
    if (cell.loLbl) drawCallout(cell.loLbl[0], cell.loLbl[1], "偽足", "#1a5276");

    if (t > 1.2 && t < 4.5) {
      drawCallout(cx - 160, cy - 175, "細胞膜", "#1f8a8c");
    }

    // --- Membrane wrap / pinch-off (before vacuole is fully interior) ---
    // Open wrapping ring around particle at the edge while arms close
    if (pinch > 0.05 && vacForm < 0.85) {
      const wrapR = partR + 16;
      const closeAmt = clamp(pinch * 1.05, 0, 1);
      // Draw wrap ring above cell so pinch-off is obvious
      drawWrapRing(edgeX, edgeY, wrapR, closeAmt, Math.min(1, pinch * 1.2) * (1 - vacForm * 0.9));
      if (pinch > 0.35 && vacForm < 0.45) {
        drawCallout(edgeX, edgeY - wrapR - 36, "細胞膜包圍粒子", "#1f8a8c");
      }
      if (pinch > 0.75 && vacForm < 0.55) {
        drawCallout(edgeX + 70, edgeY + wrapR + 28, "掐斷成圈", "#1a5276");
      }
    }

    // Particle still outside / in pocket until vacuole has formed
    if (vacForm < 0.35) {
      const plabel = t < 3.2 ? "外來粒子" : (t < 8.5 ? "食物粒子" : null);
      drawParticle(edgeX, edgeY, partR, plabel, 0);
    }

    // Once circular vacuole exists: emphasize it + show motion into cell
    if (vacForm > 0.35) {
      const vr = lerp(partR + 14, partR + 30, Math.min(1, vacForm + vacIn * 0.35));
      // Redraw vesicle/particle on top (unclipped) so the circle stays crisp while sliding in
      if (vacIn > 0.02) {
        drawVesicle(vacX, vacY, vr, Math.min(1, vacForm));
        drawParticle(vacX, vacY, partR * lerp(1, 0.5, digest), null, digest);
      }
      if (vacIn > 0.08 && vacIn < 0.95) {
        drawInwardArrow(edgeX, edgeY, vacX, vacY, vacIn);
        drawCallout((edgeX + vacX) * 0.5, cy - 100, "吞噬泡進入內部", "#1f8a8c");
      } else if (vacForm > 0.55 && vacIn < 0.15) {
        drawCallout(vacX, vacY - vr - 30, "吞噬泡", "#1f8a8c");
      } else if (vacIn >= 0.95 && digest < 0.25) {
        drawCallout(vacX, vacY - vr - 30, "吞噬泡", "#1f8a8c");
      }
    }

    if (enzyme > 0.25 && digest < 0.65) {
      drawCallout(cx - 30, cy - 175, "溶酶體融合", "#5b7a3a");
    }
    if (enzyme > 0.55 && digest < 0.85) {
      drawCallout(vacX + 95, vacY - 70, "酶分解", "#c0392b");
    }

    if (digest > 0.35) {
      for (let i = 0; i < 7; i++) {
        const ang = i * 0.95 + animT * 0.8;
        const dist = 40 + (digest - 0.35) * 90;
        ctx.beginPath();
        ctx.arc(vacX + Math.cos(ang) * dist, vacY + Math.sin(ang) * dist, 8, 0, Math.PI * 2);
        ctx.fillStyle = "#27ae60";
        ctx.fill();
      }
      if (digest > 0.55) {
        drawCallout(cx + 220, cy + 130, "分解／中和", "#1e8449");
      }
    }

    roundRect(W - 200, H - 82, 168, 46, 8);
    ctx.fillStyle = "#fef9e7";
    ctx.fill();
    ctx.strokeStyle = "#f39c12";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = "#d68910";
    ctx.font = "bold 18px 'Noto Sans TC', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("需要能量", W - 116, H - 59);
    ctx.textBaseline = "alphabetic";

    let msg = "察覺不屬於體內的粒子";
    let col = "#d68910";
    if (t >= 14) { msg = "溶酶體融合 → 酶分解／中和"; col = "#c0392b"; }
    else if (t >= 11.2) { msg = "圓形吞噬泡 → 移入細胞內部"; col = "#1f8a8c"; }
    else if (t >= 9.0) { msg = "膜包圍粒子 · 掐斷成吞噬泡"; col = "#1f8a8c"; }
    else if (t >= 7.5) { msg = "兩條偽足合攏 · 包圍粒子"; col = "#1a5276"; }
    else if (t >= 3) { msg = "伸出兩條偽足 · 包圍粒子"; col = "#1a5276"; }
    drawCallout(W / 2, 48, msg, col);

    if (t < 5.5) {
      roundRect(28, 78, 380, 100, 10);
      ctx.fillStyle = "rgba(255,255,255,0.95)";
      ctx.fill();
      ctx.strokeStyle = "#2c5aa0";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = "#1a2332";
      ctx.font = "19px 'Noto Sans TC', sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("流程：察覺 → 偽足包圍", 44, 112);
      ctx.fillText("→ 膜掐斷成吞噬泡 → 進入內部", 44, 140);
      ctx.fillText("→ 溶酶體／酶分解", 44, 168);
    }
  }

  function loop(now) {
    if (playing) {
      animT = (now - clock0) / 1000;
      if (animT >= DURATION) {
        if (animT >= DURATION + 2.2) {
          animT = 0;
          clock0 = now;
        } else animT = DURATION;
      }
    } else {
      clock0 = now - animT * 1000;
    }
    drawFrame();
    updateUI();
    requestAnimationFrame(loop);
  }

  btnPlay.addEventListener("click", () => {
    playing = !playing;
    if (playing) clock0 = performance.now() - animT * 1000;
    updateUI();
  });
  document.getElementById("btnRestart").addEventListener("click", restart);
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      e.preventDefault();
      playing = !playing;
      if (playing) clock0 = performance.now() - animT * 1000;
      updateUI();
    } else if (e.code === "KeyR") {
      e.preventDefault();
      restart();
    } else if (e.code === "ArrowRight") {
      e.preventDefault();
      const i = currentPhaseIndex();
      const next = Math.min(phases.length - 1, i + 1);
      seekTo(phases[next].t0 + 0.08);
    } else if (e.code === "ArrowLeft") {
      e.preventDefault();
      const i = currentPhaseIndex();
      const prev = Math.max(0, i - 1);
      seekTo(phases[prev].t0 + 0.08);
    }
  });

  updateUI();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
