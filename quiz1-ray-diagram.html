<style>

<body>

<header>
  <a class="back-link" href="f3-physics.html">← 返回中三物理</a>
  <h1>小測一：逐步繪畫光線圖</h1>
  <span class="sub" id="headerSub">中三物理 · 光</span>

  <button type="button" id="btnPrev" title="快捷鍵 ←">◀ 上一步</button>

<main>
  <div id="nav">
    <div class="nav-title">題目選單 <span style="font-weight:600;color:#b8c6dc;font-size:12px">（按 1–4）</span></div>

    <label class="check"><input type="checkbox" id="chkNormal" checked> 顯示法線</label>

      <div><span class="sw" style="background:#ff7ad9;height:0;border-top:3px dashed #ff7ad9"></span>鏡後虛線／虛像（無箭號延長）</div>

      教學規則：入射／反射用實線＋箭號；鏡後方用<strong style="color:#ff7ad9">無箭號虛線</strong>；虛像用虛線。<br>
      快捷鍵：<kbd>←</kbd><kbd>→</kbd> 換步　<kbd>Space</kbd> 暫停／自動播放　<kbd>R</kbd> 重播　<kbd>F</kbd> 全螢幕　<kbd>1</kbd>–<kbd>4</kbd> 切換場景

<footer>
  <div id="conclusion">準備開始：先認識場景</div>
  <div id="formula">反射定律：入射角 i ＝ 反射角 r（法線垂直於鏡面）</div>
</footer>

<script>

(() => {
  'use strict';

  const COL = {
    I: '#ffd84a',
    R: '#ff8a6a',
    V: '#ff7ad9',
    N: 'rgba(127,220,255,0.9)',
    ink: '#e8eef8',
    mute: '#9eb0c8',
    ok: '#7dffa0',
    acc: '#7fdcff',
    text: '#f4f7fb'
  };

  const AUTO_HOLD_MS = 1700;
  const GROW_MS = 1100;

  // =========================================================
  // 數學工具（y 向上的世界座標）
  // =========================================================
  const hypot = Math.hypot;
  function add(a, b) { return { x: a.x + b.x, y: a.y + b.y }; }
  function sub(a, b) { return { x: a.x - b.x, y: a.y - b.y }; }
  function mul(a, s) { return { x: a.x * s, y: a.y * s }; }
  function dot(a, b) { return a.x * b.x + a.y * b.y; }
  function len(a) { return hypot(a.x, a.y) || 1e-9; }
  function norm(a) { const L = len(a); return { x: a.x / L, y: a.y / L }; }
  function lerp(a, b, t) { return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; }
  function seg(p, a, b) {
    if (p <= a) return 0;
    if (p >= b) return 1;
    return (p - a) / (b - a);
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  // 點對直線（通過 p0、單位方向 d 或兩點 a-b）的鏡像
  function reflectPoint(p, a, b) {
    const d = norm(sub(b, a));
    const ap = sub(p, a);
    const proj = add(a, mul(d, dot(ap, d)));
    return sub(mul(proj, 2), p); // 2*proj - p
  }
  // 單位法線（指向 side 這一側）
  function normalToward(a, b, sidePoint) {
    const d = norm(sub(b, a));
    let n = { x: -d.y, y: d.x };
    const mid = lerp(a, b, 0.5);
    if (dot(n, sub(sidePoint, mid)) < 0) n = { x: -n.x, y: -n.y };
    return n;
  }
  // 線段 a-b 與線段 c-d 的交點（無限直線）
  function lineIntersect(a, b, c, d) {
    const r = sub(b, a), s = sub(d, c);
    const den = r.x * s.y - r.y * s.x;
    if (Math.abs(den) < 1e-9) return null;
    const t = ((c.x - a.x) * s.y - (c.y - a.y) * s.x) / den;
    return add(a, mul(r, t));
  }
  // 反射方向：入射速度 I（指向鏡面），N 為指向入射側的單位法線
  function reflectDirI(I, N) {
    const n = norm(N);
    const i = I; // 不必單位
    const k = 2 * dot(i, n);
    return sub(i, mul(n, k));
  }

  // =========================================================
  // 場景幾何（預先計算）
  // =========================================================

  // ---------- A. 第 1 題 (b)：枱燈、書本、眼睛 ----------
  const A = (() => {
    const bookTop = 0;
    const book = { x: 0, y: bookTop, w: 4.4, d: 1.7, h: 1.45 }; // 中心、半寬、厚度視覺、高度
    const lampBulb = { x: 6.6, y: 4.35 };
    const eye = { x: -6.4, y: 5.15 };
    // 眼睛對書面的鏡像，用來求正確擊中點（保證 i＝r）
    const eyeImg = { x: eye.x, y: -eye.y };
    const hit = lineIntersect(lampBulb, eyeImg, { x: -20, y: 0 }, { x: 20, y: 0 });
    const coneHits = [
      { x: hit.x - 1.55, y: 0 },
      hit,
      { x: hit.x + 1.65, y: 0 }
    ];
    return { book, lampBulb, eye, hit, coneHits, bookTop };
  })();

  // ---------- B. 第 2 題：鉛筆與平面鏡（1 格＝1 cm） ----------
  const B = (() => {
    const MIRROR_X = 8;
    const tip = { x: 0, y: 6 };
    const base = { x: 0, y: 0 };
    const imgTip = { x: 16, y: 6 };
    const imgBase = { x: 16, y: 0 };
    // 題目已給的兩條筆尖入射線（擊中點在格線上：低 2 cm、4 cm）
    const givenHits = [ { x: 8, y: 4 }, { x: 8, y: 2 } ];
    // 筆底兩條入射線（如標答，斜向上射向鏡面）
    const baseHits = [ { x: 8, y: 2.6 }, { x: 8, y: 1.3 } ];
    // 眼睛（左上方，如標答）：各接收一條來自筆尖虛像的反射線
    const eyes = [ { x: -2.3, y: 9.15 }, { x: -2.15, y: 7.35 } ];
    const eyeHits = eyes.map(e => {
      const hit = lineIntersect(imgTip, e, { x: 8, y: -20 }, { x: 8, y: 20 });
      return hit;
    });
    function rEnd(from, hit, length) {
      const I = sub(hit, from);
      const R = { x: -I.x, y: I.y }; // 垂直鏡：只反轉 x
      return add(hit, mul(norm(R), length));
    }
    return {
      MIRROR_X, tip, base, imgTip, imgBase, givenHits, baseHits, eyes, eyeHits,
      givenRefl: givenHits.map(h => rEnd(tip, h, 5.5)),
      baseRefl: baseHits.map(h => rEnd(base, h, 4.2)),
      pencilW: 0.55
    };
  })();

  // ---------- C. 第 3 題：潛望鏡（兩塊 45°、斜率 +1 的平面鏡） ----------
  const C = (() => {
    // 上鏡：y - x = 165；下鏡：y - x = -90
    const cU = 165, cL = -90;
    const sceneTop = { x: 292, y: 320 };
    const sceneBot = { x: 292, y: 285 }; // 三角形底
    const rayYs = [320, 285];
    const upperHits = rayYs.map(y => ({ x: y - cU, y }));
    const lowerHits = upperHits.map(h => ({ x: h.x, y: h.x + cL }));
    const eyePts = lowerHits.map(h => ({ x: -28, y: h.y }));
    const upperMir = { a: { x: 105, y: 270 }, b: { x: 175, y: 340 } };
    const lowerMir = { a: { x: 100, y: 10 },  b: { x: 185, y: 95 } };
    // 景物：正立三角箭號
    const scene = { x: 292, baseY: 285, topY: 328, half: 16 };
    const image = { x: 350, baseY: 285, topY: 328, half: 16 };
    const eye = { x: -28, y: (lowerHits[0].y + lowerHits[1].y) / 2 };
    // 潛望鏡外殼
    const body = [
      { x: 0, y: 0 }, { x: 200, y: 0 }, { x: 200, y: 255 },
      { x: 252, y: 255 }, { x: 252, y: 350 }, { x: 78, y: 350 },
      { x: 78, y: 100 }, { x: 0, y: 100 }
    ];
    return {
      cU, cL, upperHits, lowerHits, eyePts, upperMir, lowerMir,
      scene, image, eye, body, rayYs, sceneTop, sceneBot
    };
  })();

  // ---------- D. 第 19 題：透視箱（斜鏡，點對鏡面對稱） ----------
  const D = (() => {
    const box = { x: 0, y: 0, w: 420, h: 270 };
    // 斜鏡：由左上到右下，斜率 -1（約 45°，接近原圖）
    // 線：x + y = 310
    const mir = { a: { x: 78, y: 232 }, b: { x: 262, y: 48 } };
    const c = 310; // x+y
    function imgOf(p) { return { x: c - p.y, y: c - p.x }; }
    // 杯子（左下，鏡前）
    const cup = {
      cx: 95, y0: 14, y1: 70, r0: 22, r1: 16 // 底半徑、頂半徑
    };
    // 杯子輪廓上的取樣點，用來畫真正的鏡像
    function cupPoints() {
      const pts = [];
      // 頂緣（左→右）
      for (let i = 0; i <= 8; i++) {
        const t = i / 8, ang = Math.PI - t * Math.PI;
        pts.push({ x: cup.cx + cup.r1 * Math.cos(ang), y: cup.y1 + 3 * Math.sin(ang) * 0.15 });
      }
      // 右側到杯底
      pts.push({ x: cup.cx + cup.r0, y: cup.y0 + 6 });
      // 底緣右→左
      for (let i = 0; i <= 6; i++) {
        const t = i / 6;
        pts.push({ x: cup.cx + cup.r0 * (1 - 2 * t), y: cup.y0 });
      }
      pts.push({ x: cup.cx - cup.r0, y: cup.y0 + 6 });
      pts.push({ x: cup.cx - cup.r1, y: cup.y1 });
      return pts;
    }
    const cupPts = cupPoints();
    const cupImgPts = cupPts.map(imgOf);
    // 取杯子頂緣中點作為光線起點
    const src = { x: cup.cx, y: cup.y1 };
    const srcImg = imgOf(src);
    // 眼睛（箱外左方，向右望入觀景孔）
    const eye = { x: -48, y: 168 };
    const hole = { x: 0, y1: 148, y2: 188 };
    const hit = lineIntersect(eye, srcImg, mir.a, mir.b);
    const paper = { x: 400, y: 18, w: 14, h: 234 };
    return { box, mir, c, cup, cupPts, cupImgPts, src, srcImg, eye, hole, hit, paper, imgOf };
  })();

  // =========================================================
  // 步驟定義
  // =========================================================
  const SCENES = [
    {
      id: 'A',
      title: '第 1 題 (b)：為何能看見書本',
      headerSub: '丁部 · 第 1 題 (b)',
      formulaDefault: '反射定律：入射角 i ＝ 反射角 r（法線垂直於書面）',
      steps: [
        {
          title: '步驟 0：出示枱燈、書本與小華的眼睛',
          sub: '出示場景',
          desc: '右上方是<strong>枱燈</strong>（發光體），桌上是<strong>書本</strong>（非發光體），左上方是<strong>小華的眼睛</strong>。想一想：書本自己會發光嗎？小華為甚麼看得見它？',
          footer: '書本是非發光體，自己不會發光',
          anim: 'none'
        },
        {
          title: '步驟 1：枱燈發出光束射向書本',
          sub: '畫出入射光線',
          desc: '由枱燈畫出<strong>光束</strong>（兩三條入射光線，實線＋箭號）射向書本。標註「入射光線」。這些光線來自發光體。',
          footer: '入射光線：實線＋箭號，由枱燈射向書本',
          anim: 'inc'
        },
        {
          title: '步驟 2：在擊中點畫法線',

  // =========================================================
  // 狀態
  // =========================================================
  const state = {
    scene: 0,
    step: 0,
    showNormal: true,
    showAngles: true,
    showGrid: true,
    autoplay: false,
    progress: 1,
    animating: false,
    lastTs: null,
    paperSlide: 0 // D 題白紙移到鏡前的進度
  };
  let holdUntil = 0;

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const stepsEl = document.getElementById('steps');
  const stepTitle = document.getElementById('stepTitle');
  const stepDesc = document.getElementById('stepDesc');
  const conclusion = document.getElementById('conclusion');
  const formula = document.getElementById('formula');
  const btnAuto = document.getElementById('btnAuto');
  const headerSub = document.getElementById('headerSub');

  function currentScene() { return SCENES[state.scene]; }
  function currentSteps() { return currentScene().steps; }

  function rebuildSteps() {
    stepsEl.innerHTML = '';
    currentSteps().forEach((s, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'step-btn' + (i === state.step ? ' active' : (i < state.step ? ' done' : ''));
      b.innerHTML = '<span class="num">' + i + '</span>' + s.sub;
      b.addEventListener('click', () => goStep(i, true));
      stepsEl.appendChild(b);
    });
  }

  function updateUI() {
    const scene = currentScene();
    const s = scene.steps[state.step];
    stepTitle.textContent = s.title;
    stepDesc.innerHTML = s.desc;
    conclusion.textContent = s.footer;
    formula.textContent = scene.formulaDefault;
    headerSub.textContent = '中三物理 · 光　｜　' + scene.headerSub;
    [...stepsEl.children].forEach((el, i) => {
      el.classList.toggle('active', i === state.step);
      el.classList.toggle('done', i < state.step);
    });
    document.querySelectorAll('.scene-btn').forEach((el, i) => {
      el.classList.toggle('active', i === state.scene);
    });
    const atEnd = state.step === scene.steps.length - 1 && state.progress >= 1;
    document.getElementById('btnPrev').disabled = state.step === 0;
    document.getElementById('btnPrev2').disabled = state.step === 0;
    document.getElementById('btnNext').disabled = atEnd && !state.autoplay;
    document.getElementById('btnNext2').disabled = atEnd && !state.autoplay;
    btnAuto.textContent = state.autoplay ? '⏸ 暫停' : '▶ 自動播放';
  }

  function goScene(i, replayAnim) {
    i = clamp(i | 0, 0, SCENES.length - 1);
    state.scene = i;
    state.autoplay = false;
    rebuildSteps();
    goStep(0, !!replayAnim);
    if (!replayAnim) {
      state.progress = 1;
      state.animating = false;
    }
    updateUI();
  }

  function goStep(i, replayAnim) {
    const steps = currentSteps();
    i = clamp(i, 0, steps.length - 1);
    state.step = i;
    const needsAnim = steps[i].anim !== 'none';
    if (replayAnim && needsAnim) {
      state.progress = 0;
      state.animating = true;
      state.lastTs = null;
      if (steps[i].anim === 'screen') state.paperSlide = 0;
    } else {
      state.progress = 1;
      state.animating = false;
      if (steps[i].anim === 'screen') state.paperSlide = 1;
    }
    holdUntil = 0;
    updateUI();
  }

  function nextStep() {
    const steps = currentSteps();
    if (state.step >= steps.length - 1 && state.progress >= 1) {
      state.autoplay = false;
      updateUI();
      return;
    }
    if (state.progress < 1) {
      state.progress = 1;
      state.animating = false;
      if (steps[state.step].anim === 'screen') state.paperSlide = 1;
      updateUI();
      return;
    }
    goStep(state.step + 1, true);
  }

  function prevStep() {
    state.autoplay = false;
    if (state.progress < 1 && state.step > 0) {
      goStep(state.step, false);
      state.progress = 1;
      updateUI();
      return;
    }
    goStep(Math.max(0, state.step - 1), false);
    state.progress = 1;
    updateUI();
  }

  function replay() {
    state.autoplay = false;
    goStep(0, true);
    state.progress = 1;
    state.animating = false;
    updateUI();
  }

  function toggleAuto() {
    state.autoplay = !state.autoplay;
    if (state.autoplay) {
      const steps = currentSteps();
      if (state.step === steps.length - 1 && state.progress >= 1) {
        goStep(0, true);
        state.progress = 1;
        state.animating = false;
        holdUntil = performance.now() + 800;
      } else if (state.progress >= 1) {
        holdUntil = performance.now() + 400;
      } else {
        state.animating = true;
        state.lastTs = null;
      }
    }
    updateUI();
  }

  // =========================================================
  // 繪圖：相機與原語
  // =========================================================
  let W = 0, H = 0, dpr = 1;
  let scale = 1, ox = 0, oy = 0;

  function resize() {
    const rect = cv.parentElement.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.floor(rect.width));
    H = Math.max(1, Math.floor(rect.height));
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // y 向上
  function setWorld(xmin, xmax, ymin, ymax, pad) {
    pad = pad == null ? 0.10 : pad;
    const wx = xmax - xmin, wy = ymax - ymin;
    scale = Math.min(W * (1 - 2 * pad) / wx, H * (1 - 2 * pad) / wy);
    ox = W / 2 - (xmin + xmax) / 2 * scale;
    oy = H / 2 + (ymin + ymax) / 2 * scale;
  }
  function tx(x) { return ox + x * scale; }
  function ty(y) { return oy - y * scale; }

  function lw(n) { return Math.max(1.2, n * scale / 18); } // 以「約 18 px／世界單位」作基準時的線寬
  function fs(n) { return Math.max(11, n * scale / 18); }

  function drawArrowHead(x1, y1, x2, y2, color, size) {
    const px1 = tx(x1), py1 = ty(y1), px2 = tx(x2), py2 = ty(y2);
    const ang = Math.atan2(py2 - py1, px2 - px1);
    const s = size || Math.max(9, 11 * scale / 28);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(px2, py2);
    ctx.lineTo(px2 - s * Math.cos(ang - 0.4), py2 - s * Math.sin(ang - 0.4));
    ctx.lineTo(px2 - s * Math.cos(ang + 0.4), py2 - s * Math.sin(ang + 0.4));
    ctx.closePath();
    ctx.fill();
  }

  function drawSolidRay(x1, y1, x2, y2, color, width, withArrow, t) {
    t = t == null ? 1 : clamp(t, 0, 1);
    if (t <= 0) return;
    const x = x1 + (x2 - x1) * t;
    const y = y1 + (y2 - y1) * t;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.setLineDash([]);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(tx(x1), ty(y1));
    ctx.lineTo(tx(x), ty(y));
    ctx.stroke();
    if (withArrow && t > 0.08) {
      const midT = Math.min(t, 0.58);
      if (t >= 0.45) {
        const mx = x1 + (x2 - x1) * midT;
        const my = y1 + (y2 - y1) * midT;
        const mx0 = x1 + (x2 - x1) * (midT - 0.02);
        const my0 = y1 + (y2 - y1) * (midT - 0.02);
        drawArrowHead(mx0, my0, mx, my, color, Math.max(8, 10 * scale / 28));
      }
      drawArrowHead(x1, y1, x, y, color, Math.max(9, 11 * scale / 28));
    }
  }

  function drawDashed(x1, y1, x2, y2, color, width, t) {
    t = t == null ? 1 : clamp(t, 0, 1);
    if (t <= 0) return;
    const x = x1 + (x2 - x1) * t;
    const y = y1 + (y2 - y1) * t;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.setLineDash([8, 7]);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tx(x1), ty(y1));
    ctx.lineTo(tx(x), ty(y));
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // 折線按弧長生長（用於潛望鏡多段光線）
  function drawPolyline(pts, color, width, withArrow, t, dashed) {
    t = t == null ? 1 : clamp(t, 0, 1);
    if (t <= 0 || pts.length < 2) return;
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const L = len(sub(pts[i + 1], pts[i]));
      segs.push(L);
      total += L;
    }
    let remain = total * t;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.setLineDash(dashed ? [8, 7] : []);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(tx(pts[0].x), ty(pts[0].y));
    let last = pts[0], prev = pts[0];
    for (let i = 0; i < segs.length; i++) {
      if (remain <= 0) break;
      const a = pts[i], b = pts[i + 1];
      const L = segs[i];
      const use = Math.min(L, remain);
      const p = lerp(a, b, use / L);
      ctx.lineTo(tx(p.x), ty(p.y));
      prev = last;
      last = p;
      remain -= use;
    }
    ctx.stroke();
    ctx.setLineDash([]);
    if (withArrow && t > 0.1) {
      drawArrowHead(prev.x, prev.y, last.x, last.y, color, Math.max(9, 11 * scale / 28));
      // 中段箭號：已走完的整段中點
      if (t > 0.55) {
        let acc = 0, mid = total * 0.45;
        for (let i = 0; i < segs.length; i++) {
          if (acc + segs[i] >= mid) {
            const u = (mid - acc) / segs[i];
            const p0 = lerp(pts[i], pts[i + 1], Math.max(0, u - 0.04));
            const p1 = lerp(pts[i], pts[i + 1], u);
            drawArrowHead(p0.x, p0.y, p1.x, p1.y, color, Math.max(8, 10 * scale / 28));
            break;
          }
          acc += segs[i];
        }
      }
    }
  }

  function drawLabel(text, x, y, color, fontSize, align, baseline) {
    ctx.fillStyle = color || '#fff';
    ctx.font = 'bold ' + (fontSize || Math.max(14, fs(16))) + 'px "Microsoft JhengHei", "PingFang HK", sans-serif';
    ctx.textAlign = align || 'center';
    ctx.textBaseline = baseline || 'middle';
    ctx.fillText(text, tx(x), ty(y));
  }

  function drawDot(p, color, r) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(tx(p.x), ty(p.y), r || Math.max(3.5, 4.2 * scale / 28), 0, Math.PI * 2);
    ctx.fill();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function drawGridWorld(xmin, xmax, ymin, ymax, step, alpha) {
    if (!state.showGrid) return;
    ctx.strokeStyle = 'rgba(127,220,255,' + (alpha == null ? 0.10 : alpha) + ')';
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
    for (let x = xmin; x <= xmax + 1e-6; x += step) {
      ctx.beginPath();
      ctx.moveTo(tx(x), ty(ymin));
      ctx.lineTo(tx(x), ty(ymax));
      ctx.stroke();
    }
    for (let y = ymin; y <= ymax + 1e-6; y += step) {
      ctx.beginPath();
      ctx.moveTo(tx(xmin), ty(y));
      ctx.lineTo(tx(xmax), ty(y));
      ctx.stroke();
    }
  }

  function drawNormal(hit, nDir, lenN, t, label) {
    if (!state.showNormal) return;
    t = t == null ? 1 : t;
    if (t <= 0) return;
    const L = (lenN || 1.6) * t;
    const a = add(hit, mul(nDir, L));
    const b = add(hit, mul(nDir, -L * 0.35));
    ctx.strokeStyle = COL.N;
    ctx.lineWidth = Math.max(1.4, lw(1.8));
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.moveTo(tx(a.x), ty(a.y));
    ctx.lineTo(tx(b.x), ty(b.y));
    ctx.stroke();
    ctx.setLineDash([]);
    if (state.showAngles && t > 0.7 && label !== false) {
      const lp = add(hit, mul(nDir, L + 0.25));
      drawLabel('法線', lp.x, lp.y, COL.acc, fs(14));
    }
  }

  function drawAngleArcs(hit, from, to, nDir, t, labels) {
    if (!state.showAngles || !state.showNormal) return;
    t = t == null ? 1 : t;
    if (t < 0.45) return;
    const inc = norm(sub(from, hit)); // 由擊中點指向光源
    const ref = norm(sub(to, hit));
    const n = norm(nDir);
    const aN = Math.atan2(-n.y, n.x);     // canvas 角（y 向下已在 ty 處理，這裏用世界角再轉）
    // 改用像素角
    function pixAng(v) {
      const p0 = { x: tx(hit.x), y: ty(hit.y) };
      const p1 = { x: tx(hit.x + v.x), y: ty(hit.y + v.y) };
      return Math.atan2(p1.y - p0.y, p1.x - p0.x);
    }
    const angN = pixAng(n);
    const angI = pixAng(inc);
    const angR = pixAng(ref);
    const rad = Math.max(16, 22 * scale / 28);
    function sweep(a, b) {
      // 由 a 畫到 b，取較小夾角
      let d = b - a;
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      return d;
    }
    ctx.lineWidth = Math.max(1.3, 1.6 * scale / 28);
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.strokeStyle = COL.I;
    ctx.arc(tx(hit.x), ty(hit.y), rad, angN, angN + sweep(angN, angI), sweep(angN, angI) < 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.strokeStyle = COL.R;
    ctx.arc(tx(hit.x), ty(hit.y), rad * 0.72, angN, angN + sweep(angN, angR), sweep(angN, angR) < 0);
    ctx.stroke();

    if (labels !== false) {
      const iPos = add(hit, mul(norm(add(n, inc)), 1.15));
      const rPos = add(hit, mul(norm(add(n, ref)), 0.95));
      const lab = labels || { i: 'i', r: 'r' };
      drawLabel(lab.i, iPos.x, iPos.y, COL.I, fs(15));
      drawLabel(lab.r, rPos.x, rPos.y, COL.R, fs(15));
    }
  }

  function drawHatchMirror(a, b, backSidePoint, color) {
    // 鏡面粗線 + 鏡背短斜線（朝 backSidePoint 一側）
    ctx.strokeStyle = color || '#e8eef8';
    ctx.lineWidth = Math.max(3, lw(3.4));
    ctx.setLineDash([]);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tx(a.x), ty(a.y));
    ctx.lineTo(tx(b.x), ty(b.y));
    ctx.stroke();
    const d = sub(b, a);
    const L = len(d);
    const u = norm(d);
    let n = { x: -u.y, y: u.x };
    const mid = lerp(a, b, 0.5);
    if (dot(n, sub(backSidePoint, mid)) < 0) n = { x: -n.x, y: -n.y };
    ctx.strokeStyle = '#9eb0c8';
    ctx.lineWidth = Math.max(1.4, lw(1.7));
    const step = Math.max(0.35, L / 14);
    const hLen = Math.max(0.45, L * 0.06);
    for (let s = step * 0.35; s < L - step * 0.15; s += step) {
      const p = add(a, mul(u, s));
      const q = add(add(p, mul(n, hLen)), mul(u, hLen * 0.45));
      ctx.beginPath();
      ctx.moveTo(tx(p.x), ty(p.y));
      ctx.lineTo(tx(q.x), ty(q.y));
      ctx.stroke();
    }
  }

  function drawEye(p, look, scaleE, label, labelOff) {
    // look：眼睛「尖端」指向的方向（單位或非單位）
    const s = scaleE || 1;
    const u = norm(look);
    const v = { x: -u.y, y: u.x };
    const tip = add(p, mul(u, 0.85 * s));
    const back = add(p, mul(u, -0.85 * s));
    const w = 0.95 * s;
    const p1 = add(back, mul(v, w));
    const p2 = add(back, mul(v, -w));
    ctx.strokeStyle = '#e8eef8';
    ctx.lineWidth = Math.max(2, lw(2.2));
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(tx(tip.x), ty(tip.y));
    ctx.lineTo(tx(p1.x), ty(p1.y));
    ctx.lineTo(tx(p2.x), ty(p2.y));
    ctx.closePath();
    ctx.stroke();
    // 虹膜
    const c = add(p, mul(u, 0.08 * s));
    ctx.beginPath();
    ctx.arc(tx(c.x), ty(c.y), Math.max(4, 0.38 * s * scale), 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#7fdcff';
    ctx.beginPath();
    ctx.arc(tx(c.x), ty(c.y), Math.max(2, 0.16 * s * scale), 0, Math.PI * 2);
    ctx.fill();
    if (label) {
      const lp = labelOff || add(p, { x: 0, y: -1.3 * s });
      drawLabel(label, lp.x, lp.y, COL.mute, fs(14));
    }
  }

  function drawPencil(tip, base, w, color, dashed) {
    const u = norm(sub(tip, base));
    const v = { x: -u.y, y: u.x };
    const H = len(sub(tip, base));
    const cone = 0.22 * H;
    const ferrule = 0.07 * H;
    const coneBase = add(tip, mul(u, -cone));
    const bodyBot = add(base, mul(u, ferrule));
    const hw = w;
    function side(p, s) { return add(p, mul(v, s)); }
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(2, lw(2.2));
    ctx.setLineDash(dashed ? [7, 6] : []);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    // 筆尖
    ctx.beginPath();
    ctx.moveTo(tx(tip.x), ty(tip.y));
    ctx.lineTo(tx(side(coneBase, hw).x), ty(side(coneBase, hw).y));
    ctx.lineTo(tx(side(coneBase, -hw).x), ty(side(coneBase, -hw).y));
    ctx.closePath();
    ctx.stroke();
    // 筆身
    ctx.beginPath();
    ctx.moveTo(tx(side(coneBase, hw).x), ty(side(coneBase, hw).y));
    ctx.lineTo(tx(side(bodyBot, hw).x), ty(side(bodyBot, hw).y));
    ctx.lineTo(tx(side(bodyBot, -hw).x), ty(side(bodyBot, -hw).y));
    ctx.lineTo(tx(side(coneBase, -hw).x), ty(side(coneBase, -hw).y));
    ctx.closePath();
    ctx.stroke();
    // 筆尾金屬環／擦膠
    ctx.beginPath();
    ctx.moveTo(tx(side(bodyBot, hw * 1.08).x), ty(side(bodyBot, hw * 1.08).y));
    ctx.lineTo(tx(side(base, hw * 1.08).x), ty(side(base, hw * 1.08).y));
    ctx.lineTo(tx(side(base, -hw * 1.08).x), ty(side(base, -hw * 1.08).y));
    ctx.lineTo(tx(side(bodyBot, -hw * 1.08).x), ty(side(bodyBot, -hw * 1.08).y));
    ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);
    if (!dashed) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(tx(tip.x), ty(tip.y), Math.max(3, 4 * scale / 28), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawCup(cx, y0, y1, r0, r1, color, dashed) {
    const topL = { x: cx - r1, y: y1 }, topR = { x: cx + r1, y: y1 };
    const botL = { x: cx - r0, y: y0 }, botR = { x: cx + r0, y: y0 };
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(2, lw(2.2));
    ctx.setLineDash(dashed ? [6, 5] : []);
    ctx.beginPath();
    ctx.moveTo(tx(topL.x), ty(topL.y));
    ctx.lineTo(tx(botL.x), ty(botL.y));
    ctx.lineTo(tx(botR.x), ty(botR.y));
    ctx.lineTo(tx(topR.x), ty(topR.y));
    ctx.stroke();
    // 頂橢圓
    const rx = r1 * scale, ry = Math.max(3, 0.22 * r1 * scale);
    ctx.beginPath();
    ctx.ellipse(tx(cx), ty(y1), rx, ry, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawCupTransformed(pts, color, dashed, topLo, topHi) {
    if (!pts.length) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(2, lw(2.2));
    ctx.setLineDash(dashed ? [6, 5] : []);
    ctx.beginPath();
    ctx.moveTo(tx(pts[0].x), ty(pts[0].y));
    for (let i = 1; i < pts.length; i++) ctx.lineTo(tx(pts[i].x), ty(pts[i].y));
    ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawLamp(bulb) {
    // 燈罩開口朝向左下（書本）
    const shadeFront = { x: bulb.x - 0.15, y: bulb.y - 0.15 };
    const dir = norm({ x: -1.15, y: -0.85 });
    const side = { x: -dir.y, y: dir.x };
    const back = add(bulb, mul(dir, -1.7));
    const hinge = add(back, { x: 0.55, y: 0.15 });
    const stand = { x: bulb.x + 2.55, y: 0 };
    // 底座
    ctx.strokeStyle = '#d5deec';
    ctx.lineWidth = Math.max(2, lw(2));
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.ellipse(tx(stand.x), ty(0.15), 1.15 * scale, 0.28 * scale, 0, 0, Math.PI * 2);
    ctx.stroke();
    // 支柱
    ctx.beginPath();
    ctx.moveTo(tx(stand.x), ty(0.2));
    ctx.lineTo(tx(stand.x), ty(4.6));
    ctx.stroke();
    // 關節
    ctx.beginPath();
    ctx.arc(tx(stand.x), ty(4.6), Math.max(3, 0.16 * scale), 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(tx(stand.x), ty(4.6));
    ctx.lineTo(tx(back.x + 0.3), ty(back.y + 0.35));
    ctx.stroke();
    // 燈罩（梯形）
    const f1 = add(bulb, add(mul(dir, 0.35), mul(side, 0.95)));
    const f2 = add(bulb, add(mul(dir, 0.35), mul(side, -0.95)));
    const b1 = add(bulb, add(mul(dir, -1.45), mul(side, 0.55)));
    const b2 = add(bulb, add(mul(dir, -1.45), mul(side, -0.55)));
    ctx.fillStyle = 'rgba(255,216,74,0.10)';
    ctx.beginPath();
    ctx.moveTo(tx(f1.x), ty(f1.y));
    ctx.lineTo(tx(f2.x), ty(f2.y));
    ctx.lineTo(tx(b2.x), ty(b2.y));
    ctx.lineTo(tx(b1.x), ty(b1.y));
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // 燈泡
    ctx.fillStyle = '#ffd84a';
    ctx.beginPath();
    ctx.arc(tx(bulb.x), ty(bulb.y), Math.max(4, 0.22 * scale), 0, Math.PI * 2);
    ctx.fill();
    drawLabel('枱燈', stand.x + 1.7, 3.3, COL.mute, fs(15));
  }

  function drawBook(book) {
    const { x, y, w, d, h } = book;
    // 立體書：頂面、前面、側面
    const top = [
      { x: x - w, y: y }, { x: x + w, y: y },
      { x: x + w + d * 0.7, y: y + d * 0.45 }, { x: x - w + d * 0.7, y: y + d * 0.45 }
    ];
    // 其實 y 向上，書在 y=0 的頂面；厚度向下（-y）不好看，改為視覺上「向前」的 3D（+x/+y 一點）
    ctx.fillStyle = 'rgba(232,238,248,0.07)';
    ctx.strokeStyle = '#e8eef8';
    ctx.lineWidth = Math.max(2, lw(2.2));
    ctx.setLineDash([]);
    // 前面
    ctx.beginPath();
    ctx.moveTo(tx(x - w), ty(y));
    ctx.lineTo(tx(x + w), ty(y));
    ctx.lineTo(tx(x + w), ty(y - h));
    ctx.lineTo(tx(x - w), ty(y - h));
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // 頂面（稍向後）
    ctx.beginPath();
    ctx.moveTo(tx(x - w), ty(y));
    ctx.lineTo(tx(x - w + d * 0.55), ty(y + d * 0.38));
    ctx.lineTo(tx(x + w + d * 0.55), ty(y + d * 0.38));
    ctx.lineTo(tx(x + w), ty(y));
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // 右側
    ctx.beginPath();
    ctx.moveTo(tx(x + w), ty(y));
    ctx.lineTo(tx(x + w + d * 0.55), ty(y + d * 0.38));
    ctx.lineTo(tx(x + w + d * 0.55), ty(y - h + d * 0.38));
    ctx.lineTo(tx(x + w), ty(y - h));
    ctx.closePath();
    ctx.stroke();
    // 書頁線
    ctx.strokeStyle = 'rgba(200,214,232,0.7)';
    ctx.lineWidth = 1;
    for (let i = 1; i <= 4; i++) {
      const yy = y - 0.08;
      const t = i / 5;
      ctx.beginPath();
      ctx.moveTo(tx(x - w * 0.7 + d * 0.15 * t), ty(y + 0.08 + 0.22 * t));
      ctx.lineTo(tx(x + w * 0.7 + d * 0.15 * t), ty(y + 0.08 + 0.22 * t));
      ctx.stroke();
    }
    drawLabel('書本', x - w - 0.2, y - h * 0.45, COL.mute, fs(15), 'right');
  }

  function drawBackground() {
    const g = ctx.createRadialGradient(W * 0.5, H * 0.45, 20, W * 0.5, H * 0.5, Math.max(W, H) * 0.62);
    g.addColorStop(0, '#122846');
    g.addColorStop(1, '#0b1730');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawStepBadge(extra) {
    ctx.fillStyle = 'rgba(127,220,255,0.92)';
    ctx.font = 'bold ' + Math.max(13, Math.min(18, W * 0.014)) + 'px "Microsoft JhengHei", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    const sc = currentScene();
    const txt = sc.title + '　步驟 ' + state.step + ' / ' + (sc.steps.length - 1) + (extra ? '　' + extra : '');
    ctx.fillText(txt, 14, 12);
  }

  // =========================================================
  // 各場景繪製
  // =========================================================
  function drawSceneA() {
    setWorld(-9.5, 10.2, -2.2, 8.4, 0.10);
    drawBackground();
    drawGridWorld(-10, 11, -2, 9, 1, 0.08);

    drawBook(A.book);
    drawLamp(A.lampBulb);
    drawEye(A.eye, sub(A.hit, A.eye), 1.05, '小華的眼睛', { x: A.eye.x, y: A.eye.y + 1.45 });

    const step = state.step, p = state.progress;
    const wI = Math.max(2.4, lw(2.6));
    const wR = Math.max(2.4, lw(2.6));

    // 步驟 1+：入射光束
    if (step >= 1) {
      A.coneHits.forEach((h, i) => {
        const t = step === 1 ? seg(p, i * 0.22, 0.35 + i * 0.28) : 1;
        const main = (i === 1);
        drawSolidRay(A.lampBulb.x, A.lampBulb.y, h.x, h.y, COL.I, wI, true, t);
      });
      if (state.showAngles && (step > 1 || p > 0.7)) {
        const mid = lerp(A.lampBulb, A.coneHits[2], 0.55);
        drawLabel('入射光線', mid.x + 1.15, mid.y + 0.55, COL.I, fs(14));
      }
    }

    // 步驟 2+：法線
    if (step >= 2) {
      const t = step === 2 ? seg(p, 0, 1) : 1;
      drawNormal(A.hit, { x: 0, y: 1 }, 2.4, t, true);
    }

    // 步驟 3+：反射線與角
    if (step >= 3) {
      const t = step === 3 ? seg(p, 0, 1) : 1;
      drawSolidRay(A.hit.x, A.hit.y, A.eye.x, A.eye.y, COL.R, wR, true, t);
      if (t > 0.55) {
        drawAngleArcs(A.hit, A.lampBulb, A.eye, { x: 0, y: 1 }, t, false);
        if (state.showAngles) {
          const midR = lerp(A.hit, A.eye, 0.42);
          drawLabel('反射光線', midR.x - 1.55, midR.y + 0.2, COL.R, fs(14));
          // 角度全稱沿光線外側標，避免疊在擊中點
          const iLab = lerp(A.hit, A.lampBulb, 0.32);
          const rLab = lerp(A.hit, A.eye, 0.22);
          drawLabel('入射角', iLab.x + 1.15, iLab.y - 0.15, COL.I, fs(14));
          drawLabel('反射角', rLab.x - 0.15, rLab.y - 0.7, COL.R, fs(14));
        }
      }
    }

    if (step >= 4) {
      const a = seg(p, 0, 0.6);
      ctx.globalAlpha = a;
      const boxW = Math.min(640, W * 0.7), boxH = 74;
      const bx = (W - boxW) / 2, by = H - boxH - 14;
      ctx.fillStyle = 'rgba(8,16,34,0.9)';
      ctx.strokeStyle = '#ffe27a';
      ctx.lineWidth = 2;
      roundRect(ctx, bx, by, boxW, boxH, 12);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffe27a';
      ctx.font = 'bold ' + Math.max(15, Math.min(20, W * 0.018)) + 'px "Microsoft JhengHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('書本是非發光體　→　反射枱燈的光　→　反射光線進入眼睛　才能看見', bx + boxW / 2, by + boxH / 2);
      ctx.globalAlpha = 1;
    }

    drawStepBadge();
  }

  function drawDimArrow(x1, y, x2, dashed, label, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1.6, lw(1.8));
    ctx.setLineDash(dashed ? [7, 6] : []);
    ctx.beginPath();
    ctx.moveTo(tx(x1), ty(y));
    ctx.lineTo(tx(x2), ty(y));
    ctx.stroke();
    ctx.setLineDash([]);
    // 兩端直標
    const tick = 0.35;
    ctx.beginPath();
    ctx.moveTo(tx(x1), ty(y - tick)); ctx.lineTo(tx(x1), ty(y + tick));
    ctx.moveTo(tx(x2), ty(y - tick)); ctx.lineTo(tx(x2), ty(y + tick));
    ctx.stroke();
    drawArrowHead(x2, y, x1, y, color, Math.max(8, 10 * scale / 28));
    drawArrowHead(x1, y, x2, y, color, Math.max(8, 10 * scale / 28));

    // 步驟 3+：虛線延長至筆尖的像

    }

    // 步驟 4+：筆底光線
    if (step >= 4) {
      B.baseHits.forEach((h, i) => {
        const ti = step === 4 ? seg(p, 0.00 + i * 0.12, 0.28 + i * 0.12) : 1;

        const tr = step === 4 ? seg(p, 0.35 + i * 0.12, 0.62 + i * 0.12) : 1;

        drawSolidRay(h.x, h.y, B.baseRefl[i].x, B.baseRefl[i].y, COL.R, wR, true, tr);
        drawDashed(h.x, h.y, B.imgBase.x, B.imgBase.y, COL.V, Math.max(1.8, lw(2)), tv);
      });
      const tm = step === 4 ? seg(p, 0.85, 1) : 1;
      if (tm > 0.2) {
        ctx.globalAlpha = tm;
        drawDot(B.imgBase, COL.V, Math.max(4, 5 * scale / 28));

      }
    }

    // 步驟 5+：整枝虛像 + 像距
    if (step >= 5) {
      const t = step === 5 ? seg(p, 0, 0.7) : 1;
      ctx.globalAlpha = Math.max(0.15, t);
      drawPencil(lerp(B.imgBase, B.imgTip, Math.max(0.08, t)), B.imgBase, B.pencilW, COL.V, true);
      ctx.globalAlpha = 1;
      if (t > 0.5) drawLabel('像（虛像）', 17.85, 3.0, COL.V, fs(15));
      const td = step === 5 ? seg(p, 0.55, 1) : 1;
      if (td > 0.2) {

        drawLabel('物距 ＝ 像距', 8, -2.55, '#ffe27a', fs(16));
        ctx.globalAlpha = 1;
      }
    }

    // 步驟 6+：眼睛與入眼光線（由虛像構造，嚴格遵守反射定律）
    if (step >= 6) {
      const tE = step === 6 ? seg(p, 0, 0.2) : 1;
      ctx.globalAlpha = Math.max(0.2, tE);
      B.eyes.forEach((e, i) => {

      });
      ctx.globalAlpha = 1;
      B.eyes.forEach((e, i) => {

        drawSolidRay(B.tip.x, B.tip.y, h.x, h.y, COL.I, wI, true, ti);
        drawSolidRay(h.x, h.y, e.x, e.y, COL.R, wR, true, tr);

      ctx.globalAlpha = 1;

    drawStepBadge();

  function drawTriangleArrow(cx, baseY, topY, half, color, dashed) {
    const tip = { x: cx, y: topY };
    const bl = { x: cx - half, y: baseY }, br = { x: cx + half, y: baseY };
    const stemTop = { x: cx, y: baseY };
    const stemBot = { x: cx, y: baseY - (topY - baseY) * 0.45 };
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(2, lw(2.3));
    ctx.setLineDash(dashed ? [7, 6] : []);
    ctx.beginPath();
    ctx.moveTo(tx(tip.x), ty(tip.y));
    ctx.lineTo(tx(bl.x), ty(bl.y));
    ctx.lineTo(tx(br.x), ty(br.y));
    ctx.closePath();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(tx(stemTop.x), ty(stemTop.y));
    ctx.lineTo(tx(stemBot.x), ty(stemBot.y));
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawSceneC() {
    setWorld(-55, 400, -40, 390, 0.08);

    drawEye(C.eye, { x: 1, y: 0 }, 18, '眼睛', { x: C.eye.x, y: C.eye.y - 28 });

    const step = state.step, p = state.progress;
    const wI = Math.max(2.3, lw(2.2));

    // 步驟 1+：水平入射
    if (step >= 1) {
      C.upperHits.forEach((h, i) => {
        const src = { x: C.scene.x - C.scene.half, y: h.y };
        const t = step === 1 ? seg(p, i * 0.3, 0.5 + i * 0.4) : 1;
        drawSolidRay(src.x, src.y, h.x, h.y, COL.I, wI, true, t);
      });
    }

    // 步驟 2+：上鏡法線與向下反射
    if (step >= 2) {
      const tn = step === 2 ? seg(p, 0, 0.25) : 1;
      // 法線：上鏡斜率 +1，法線斜率 -1，指向右下（入射側）
      const nU = norm({ x: 1, y: -1 });
      C.upperHits.forEach((h, i) => {
        if (i === 0) drawNormal(h, nU, 28, tn, true);
        const t = step === 2 ? seg(p, 0.2 + i * 0.3, 0.6 + i * 0.35) : 1;
        drawSolidRay(h.x, h.y, C.lowerHits[i].x, C.lowerHits[i].y, COL.R, wI, true, t);
        if (i === 0 && t > 0.6) {
          const from = { x: C.scene.x, y: h.y };
          drawAngleArcs(h, from, C.lowerHits[i], nU, t, { i: '45°', r: '45°' });
        }
      });
    }

    // 步驟 3+：下鏡反射入眼 + 輔助虛線
    if (step >= 3) {
      const tn = step === 3 ? seg(p, 0, 0.2) : 1;
      const nL = norm({ x: -1, y: 1 }); // 指向左上（入射側）
      C.lowerHits.forEach((h, i) => {
        if (i === 0) drawNormal(h, nL, 28, tn, true);

        drawSolidRay(h.x, h.y, C.eyePts[i].x, C.eyePts[i].y, COL.R, wI, true, t);

      });
    }

    // 步驟 4+：正立虛線成像
    if (step >= 4) {
      const t = step === 4 ? seg(p, 0, 0.7) : 1;
      ctx.globalAlpha = t;
      drawTriangleArrow(C.image.x, C.image.baseY, C.image.topY, C.image.half, COL.V, true);

      drawDashed(C.scene.x + C.scene.half, C.scene.baseY, C.image.x - C.image.half, C.image.baseY, COL.V, Math.max(1.4, lw(1.5)), t);

      drawLabel('（正立）', C.image.x, C.image.baseY - 56, COL.V, fs(14));
      ctx.globalAlpha = 1;
    }

    drawStepBadge();
  }

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('白紙移到鏡前也接不住像：這是虛像，反射光線沒有在鏡前會聚', bx + boxW / 2, by + boxH / 2);
        ctx.globalAlpha = 1;
      }
    }

    drawStepBadge();
  }

  const DRAW = [drawSceneA, drawSceneB, drawSceneC, drawSceneD];

  function drawFrame() {
    DRAW[state.scene]();
  }

  // =========================================================
  // 動畫迴圈
  // =========================================================
  function tick(ts) {
    const steps = currentSteps();
    const anim = steps[state.step].anim;
    if (state.animating && anim !== 'none') {
      if (state.lastTs == null) state.lastTs = ts;
      const dt = ts - state.lastTs;
      state.lastTs = ts;
      const dur = (anim === 'screen' || anim === 'dark') ? 1500 : GROW_MS;
      state.progress = Math.min(1, state.progress + dt / dur);
      if (state.progress >= 1) {
        state.animating = false;
        state.progress = 1;
        if (state.autoplay) holdUntil = ts + AUTO_HOLD_MS;
        updateUI();
      }
    } else if (state.autoplay && state.progress >= 1) {
      if (!holdUntil) holdUntil = ts + AUTO_HOLD_MS;
      if (ts >= holdUntil) {
        holdUntil = 0;
        if (state.step >= steps.length - 1) {
          state.autoplay = false;
          updateUI();
        } else {
          goStep(state.step + 1, true);
        }
      }
    }
    drawFrame();
    requestAnimationFrame(tick);
  }

  // =========================================================
  // 事件
  // =========================================================
  document.getElementById('btnNext').addEventListener('click', () => { state.autoplay = false; nextStep(); });
  document.getElementById('btnNext2').addEventListener('click', () => { state.autoplay = false; nextStep(); });
  document.getElementById('btnPrev').addEventListener('click', prevStep);
  document.getElementById('btnPrev2').addEventListener('click', prevStep);
  document.getElementById('btnAuto').addEventListener('click', toggleAuto);
  document.getElementById('btnReplay').addEventListener('click', replay);
  document.getElementById('btnFull').addEventListener('click', () => {
    const doc = document;
    if (doc.fullscreenElement || doc.webkitFullscreenElement) {
      (doc.exitFullscreen || doc.webkitExitFullscreen).call(doc);
    } else {
      const el = document.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    }
  });
  document.getElementById('btnAside').addEventListener('click', () => {
    document.body.classList.toggle('hide-aside');
    document.body.classList.toggle('hide-nav');
    setTimeout(resize, 60);
  });
  document.getElementById('chkNormal').addEventListener('change', e => { state.showNormal = e.target.checked; });
  document.getElementById('chkAngles').addEventListener('change', e => { state.showAngles = e.target.checked; });
  document.getElementById('chkGrid').addEventListener('change', e => { state.showGrid = e.target.checked; });

  document.querySelectorAll('.scene-btn').forEach((el) => {
    el.addEventListener('click', () => goScene(+el.dataset.scene, false));
  });

  window.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); state.autoplay = false; nextStep(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prevStep(); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); toggleAuto(); }
    else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); replay(); }
    else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); document.getElementById('btnFull').click(); }
    else if (e.key >= '1' && e.key <= '4') { e.preventDefault(); goScene(+e.key - 1, false); }
  });

  window.addEventListener('resize', () => { resize(); });

  function applyHash() {
    const h = (location.hash || '').replace('#', '').toUpperCase();
    const m = h.match(/^([ABCD])(\d+)?$/);
    if (!m) return;
    const si = 'ABCD'.indexOf(m[1]);
    goScene(si, false);
    if (m[2] != null) goStep(Math.min(+m[2], currentSteps().length - 1), false);
  }
  window.addEventListener('hashchange', applyHash);

  rebuildSteps();
  resize();
  updateUI();
  applyHash();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
