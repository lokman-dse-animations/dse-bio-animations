name: Enable GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/enable-pages.yml

permissions:
  pages: write
  administration: write
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy from branch main /
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          BODY='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST "${auth[@]}" "https://api.github.com/repos/${REPO}/pages" -d "$BODY")
          echo "POST ${code}"
          cat /tmp/pages.json
          echo
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X PUT "${auth[@]}" "https://api.github.com/repos/${REPO}/pages" -d "$BODY")
            echo "PUT ${code}"
            cat /tmp/pages.json
            echo
          fi
          if [ "$code" != "201" ] && [ "$code" != "200" ] && [ "$code" != "204" ]; then
            exit 1
          fi
          curl -sS -o /tmp/build.json -w "BUILD %{http_code}\n" -X POST "${auth[@]}" "https://api.github.com/repos/${REPO}/pages/builds" || true
          cat /tmp/build.json || true
          echo
          curl -sS "${auth[@]}" "https://api.github.com/repos/${REPO}/pages"
          echo
