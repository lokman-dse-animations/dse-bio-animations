<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教學動畫 — 年級與科目</title>
<style>
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --ink: #1a2332;
    --muted: #5a6a7a;
    --accent: #1e6b4f;
    --accent-soft: #e6f4ee;
    --border: #d0dae6;
    --disabled: #9aa8b5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background:
      radial-gradient(1200px 500px at 10% -10%, #d9efe6 0%, transparent 55%),
      radial-gradient(900px 400px at 100% 0%, #dce8f8 0%, transparent 50%),
      var(--bg);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
  }
  header {
    padding: 2.75rem 1.25rem 1.5rem;
    text-align: center;
  }
  .badge {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 0.3rem 0.7rem;
    border-radius: 999px;
    margin-bottom: 0.85rem;
  }
  header h1 {
    margin: 0 0 0.45rem;
    font-size: clamp(1.65rem, 4.5vw, 2.15rem);
    font-weight: 800;
  }
  header p {
    margin: 0 auto;
    max-width: 34rem;
    color: var(--muted);
    font-size: 1.02rem;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 1.25rem 2.5rem;
  }
  h2.section {
    margin: 1.25rem 0 0.85rem;
    font-size: 1.05rem;
    color: var(--muted);
    font-weight: 700;
  }
  .grid {
    display: grid;
    gap: 0.85rem;
    grid-template-columns: 1fr;
  }
  @media (min-width: 560px) {
    .grid { grid-template-columns: 1fr 1fr; }
  }
  a.card, .card.disabled {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.2rem 1.35rem;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 2px rgba(26, 35, 50, 0.04);
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  a.card:hover {
    border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(30, 107, 79, 0.12);
    transform: translateY(-1px);
  }
  .card h3 {
    margin: 0 0 0.3rem;
    font-size: 1.15rem;
    color: var(--accent);
  }
  .card p {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
  }
  .card.disabled {
    opacity: 0.72;
    cursor: not-allowed;
  }
  .card.disabled h3 { color: var(--disabled); }
  .meta {
    margin-top: 0.7rem;
    font-size: 0.8rem;
    color: var(--accent);
    font-weight: 600;
  }
  .card.disabled .meta { color: var(--disabled); }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 0 1rem 2.25rem;
  }
</style>
</head>
<body>
  <header>
    <div class="badge">教學動畫</div>
    <h1>揀年級與科目</h1>
    <p>先揀對應年級科目，再打開動畫。之後會陸續加入更多內容。</p>
  </header>
  <main>
    <h2 class="section">中三</h2>
    <div class="grid">
      <div class="card disabled">
        <h3>中三 · 生物</h3>
        <p>稍後推出。</p>
        <div class="meta">即將推出</div>
      </div>
      <a class="card" href="f3-physics.html">
        <h3>中三 · 物理</h3>
        <p>光的直線傳播、平面鏡成像等互動示意。</p>
        <div class="meta">2 個動畫 · 進入 →</div>
      </a>
    </div>

    <h2 class="section">中四</h2>
    <div class="grid">
      <a class="card" href="f4-biology.html">
        <h3>中四 · 生物</h3>
        <p>細胞膜結構與物質運輸等互動示意。</p>
        <div class="meta">2 個動畫 · 進入 →</div>
      </a>
    </div>
  </main>
  <footer>教學用途 · 用 Chrome 或 Safari 打開效果最佳</footer>
</body>
</html>
