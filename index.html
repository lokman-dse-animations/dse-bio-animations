<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生物科動畫 — DSE Biology</title>
<style>
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --ink: #1a2332;
    --muted: #5a6a7a;
    --accent: #1e6b4f;
    --accent-soft: #e6f4ee;
    --border: #d0dae6;
    --chip: #2c5aa0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background:
      radial-gradient(1200px 500px at 10% -10%, #d9efe6 0%, transparent 55%),
      radial-gradient(900px 400px at 100% 0%, #dce8f8 0%, transparent 50%),
      var(--bg);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
  }
  header {
    padding: 2.75rem 1.25rem 1.75rem;
    text-align: center;
  }
  .badge {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 0.3rem 0.7rem;
    border-radius: 999px;
    margin-bottom: 0.85rem;
  }
  header h1 {
    margin: 0 0 0.45rem;
    font-size: clamp(1.65rem, 4.5vw, 2.15rem);
    font-weight: 800;
  }
  header p {
    margin: 0 auto;
    max-width: 34rem;
    color: var(--muted);
    font-size: 1.02rem;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 1.25rem 2.5rem;
  }
  h2.section {
    margin: 0 0 0.85rem;
    font-size: 1.05rem;
    color: var(--muted);
    font-weight: 700;
  }
  .grid {
    display: grid;
    gap: 1rem;
  }
  a.card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.3rem 1.45rem;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 2px rgba(26, 35, 50, 0.04);
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  a.card:hover {
    border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(30, 107, 79, 0.12);
    transform: translateY(-1px);
  }
  a.card h3 {
    margin: 0 0 0.35rem;
    font-size: 1.22rem;
    color: var(--accent);
  }
  a.card p {
    margin: 0;
    color: var(--muted);
    font-size: 0.96rem;
  }
  .meta {
    margin-top: 0.85rem;
    font-size: 0.82rem;
    color: var(--chip);
    font-weight: 600;
  }
  .note {
    margin-top: 1.5rem;
    padding: 1rem 1.15rem;
    background: #fff;
    border: 1px dashed var(--border);
    border-radius: 12px;
    color: var(--muted);
    font-size: 0.92rem;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 0 1rem 2.25rem;
  }
</style>
</head>
<body>
  <header>
    <div class="badge">香港 DSE 生物科</div>
    <h1>生物科動畫</h1>
    <p>互動示意，方便課堂演示與學生自學。用 Chrome 或 Safari 打開效果最佳。</p>
  </header>
  <main>
    <h2 class="section">細胞膜</h2>
    <div class="grid">
      <a class="card" href="fluid-mosaic.html">
        <h3>流動鑲嵌模型</h3>
        <p>細胞膜結構：磷脂雙層、蛋白質與碳水化合物；第二幕可見磷脂橫向移動。</p>
        <div class="meta">←／→ 換幕 · 空白鍵暫停</div>
      </a>
      <a class="card" href="transport.html">
        <h3>物質穿越細胞膜</h3>
        <p>擴散、滲透與主動運輸等物質進出細胞的過程示意。</p>
        <div class="meta">瀏覽器直接播放</div>
      </a>
    </div>
    <div class="note">之後有新動畫會加在這裡。建議全螢幕播放，方便投影。</div>
  </main>
  <footer>生物科動畫 · 教學用途</footer>
</body>
</html>
